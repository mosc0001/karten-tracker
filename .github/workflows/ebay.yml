name: eBay-Verkäufe abfragen

on:
  schedule:
    # täglich um 04:40 UTC. Der Job entscheidet selbst, welche Karten fällig sind
    # und hält das Budget ein. An Tagen ohne fällige Karten kostet er nichts.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      karte:
        description: "Nur diese Karte abfragen (leer = normaler Lauf). Name, z. B. Machamp, oder Name | Set, z. B. Machamp | Expedition"
        required: false
        default: ""
      apify:
        description: "Diesmal über Apify auf GitHub laufen lassen (kostet), statt auf deinem Rechner"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # nur für das Lebenszeichen (leerer Commit), siehe letzter Schritt

concurrency:
  group: ebay-sales
  cancel-in-progress: false

# Wo der Job läuft, steuert die Repository-Variable EBAY_RUNNER (Settings → Secrets and variables → Actions → Variables):
#   self-hosted  = auf deinem eigenen Rechner (GitHub-Runner). Die Suche ruft eBay dann selbst ab, kostenlos.
#                  Ist der Rechner aus, wartet der Lauf bis zu 24 Stunden, bis er wieder an ist.
#   leer         = wie bisher auf GitHub, Suche über Apify (eBay sperrt GitHub-Server für eigene Abrufe).
jobs:
  ebay:
    runs-on: ${{ (vars.EBAY_RUNNER == 'self-hosted' && github.event.inputs.apify != 'true') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Windows blockiert PowerShell-Skripte standardmäßig: dort per cmd starten, sonst (GitHub, Linux) per bash
      - name: eBay-Verkäufe abfragen und Werte berechnen
        if: runner.os == 'Windows'
        shell: cmd
        run: node scripts/ebay-sales.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # own = eBay-Suche selbst abrufen (nur auf deinem Rechner), sonst Apify. Detailseiten laufen immer über Apify.
          EBAY_SCRAPER: ${{ (vars.EBAY_RUNNER == 'self-hosted' && github.event.inputs.apify != 'true') && 'own' || 'apify' }}
          # Pause zwischen zwei eigenen eBay-Abrufen in Millisekunden (höflich bleiben, nicht gesperrt werden)
          EBAY_OWN_DELAY_MS: "2500"
          # Kostenbremse in Dollar (Schätzung). Hier kannst du die Werte ändern.
          EBAY_MONTH_BUDGET_USD: "192.0"
          EBAY_RUN_BUDGET_USD: "7.0"
          EBAY_IMAGE_BUDGET_USD: "5.0"
          # die wertvollsten Karten wöchentlich, alle übrigen alle 28 Tage
          EBAY_TOP_N: "15"
          EBAY_TOP_EVERY_DAYS: "7"
          EBAY_REST_EVERY_DAYS: "14"
          # Einzelabfrage über "Run workflow" mit Kartenangabe: höchstens so viel, auch bei erreichtem Monatsbudget
          EBAY_ONLY_CARD: ${{ github.event.inputs.karte }}
          EBAY_ONLY_BUDGET_USD: "5.0"
      - name: eBay-Verkäufe abfragen und Werte berechnen
        if: runner.os != 'Windows'
        shell: bash
        run: node scripts/ebay-sales.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # own = eBay-Suche selbst abrufen (nur auf deinem Rechner), sonst Apify. Detailseiten laufen immer über Apify.
          EBAY_SCRAPER: ${{ (vars.EBAY_RUNNER == 'self-hosted' && github.event.inputs.apify != 'true') && 'own' || 'apify' }}
          # Pause zwischen zwei eigenen eBay-Abrufen in Millisekunden (höflich bleiben, nicht gesperrt werden)
          EBAY_OWN_DELAY_MS: "2500"
          # Kostenbremse in Dollar (Schätzung). Hier kannst du die Werte ändern.
          EBAY_MONTH_BUDGET_USD: "192.0"
          EBAY_RUN_BUDGET_USD: "7.0"
          EBAY_IMAGE_BUDGET_USD: "5.0"
          # die wertvollsten Karten wöchentlich, alle übrigen alle 28 Tage
          EBAY_TOP_N: "15"
          EBAY_TOP_EVERY_DAYS: "7"
          EBAY_REST_EVERY_DAYS: "14"
          # Einzelabfrage über "Run workflow" mit Kartenangabe: höchstens so viel, auch bei erreichtem Monatsbudget
          EBAY_ONLY_CARD: ${{ github.event.inputs.karte }}
          EBAY_ONLY_BUDGET_USD: "5.0"

  # GitHub schaltet zeitgesteuerte Workflows in öffentlichen Repositories ab,
  # wenn 60 Tage lang nichts im Repository passiert. Liegt der letzte Commit
  # 40 Tage oder länger zurück, legt dieser Schritt einen leeren Commit an.
  # Er ändert keine Datei und löst keine Veröffentlichung der App aus.
  # Läuft immer auf GitHub (braucht bash), auch wenn der Abruf auf deinem Rechner lief.
  lebenszeichen:
    needs: ebay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lebenszeichen (verhindert Abschalten nach 60 Tagen)
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Letzter Commit vor $days Tagen."
          if [ "$days" -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Lebenszeichen: Nachtjob aktiv halten"
            git push || echo "Push nicht möglich, nächster Versuch morgen."
          fi
