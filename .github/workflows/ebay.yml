name: eBay-Verkäufe abfragen

on:
  schedule:
    # täglich um 04:40 UTC. Der Job entscheidet selbst, welche Karten fällig sind
    # und hält das Budget ein. An Tagen ohne fällige Karten kostet er nichts.
    - cron: "40 4 * * *"
  workflow_dispatch:

permissions:
  contents: write   # nur für das Lebenszeichen (leerer Commit), siehe letzter Schritt

concurrency:
  group: ebay-sales
  cancel-in-progress: false

jobs:
  ebay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: eBay-Verkäufe abfragen und Werte berechnen
        run: node scripts/ebay-sales.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Kostenbremse in Dollar (Schätzung). Hier kannst du die Werte ändern.
          EBAY_MONTH_BUDGET_USD: "90.0"
          EBAY_RUN_BUDGET_USD: "15.0"
          EBAY_IMAGE_BUDGET_USD: "5.0"
          # die wertvollsten Karten wöchentlich, alle übrigen alle 28 Tage
          EBAY_TOP_N: "15"
          EBAY_TOP_EVERY_DAYS: "7"
          EBAY_REST_EVERY_DAYS: "14"

      # GitHub schaltet zeitgesteuerte Workflows in öffentlichen Repositories ab,
      # wenn 60 Tage lang nichts im Repository passiert. Liegt der letzte Commit
      # 40 Tage oder länger zurück, legt dieser Schritt einen leeren Commit an.
      # Er ändert keine Datei und löst keine Veröffentlichung der App aus.
      - name: Lebenszeichen (verhindert Abschalten nach 60 Tagen)
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Letzter Commit vor $days Tagen."
          if [ "$days" -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Lebenszeichen: Nachtjob aktiv halten"
            git push || echo "Push nicht möglich, nächster Versuch morgen."
          fi
