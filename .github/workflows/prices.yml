name: Preise aktualisieren

on:
  schedule:
    # täglich um 04:17 UTC (06:17 Uhr im Sommer, 05:17 Uhr im Winter)
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preise holen und speichern
        run: node scripts/update-prices.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
