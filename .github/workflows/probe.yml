name: eBay-Probe (Test)
on:
  push:
    branches: [scraper-test]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-ebay.mjs
      - uses: actions/upload-artifact@v4
        with: { name: probe-html, path: "probe-*.html" }
