<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karten">
<meta name="theme-color" content="#0d1322">
<title>Karten-Tracker</title>
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#14213d;--muted:#5b6784;--line:#d9deea;--accent:#2f5bea;--accent-ink:#fff;--danger:#b3261e;--up:#16794c;--down:#b3261e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d1322;--surface:#151d33;--ink:#e8ecf7;--muted:#9aa5c4;--line:#27314d;--accent:#7b9bff;--accent-ink:#0d1322;--danger:#ff8a80;--up:#5fd39a;--down:#ff8a80}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
.pad{padding:24px 16px}
.muted{color:var(--muted)}
.err{color:var(--danger)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 8px}
.top h1{font-size:1.25rem;white-space:nowrap}
.actions{display:flex;gap:8px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.danger{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:12px}
.wide{display:block;width:100%;margin-top:12px}
.sleeve{margin:8px 0 20px;padding:20px;border-radius:18px;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(115deg,#7ad0ff,#b69cff,#ff9fcb,#ffd979,#8fe9c0) border-box}
.total{margin:0;font-size:clamp(2.4rem,11vw,3.4rem);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.thumb{width:52px;height:72px;object-fit:contain;border-radius:4px;background:var(--line)}
.name{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.85rem;margin-top:2px}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.78rem;color:var(--muted)}
.tag.foil{border-color:transparent;background:linear-gradient(115deg,#7ad0ff66,#b69cff66,#ff9fcb66,#ffd97966);color:var(--ink)}
.tag.first{border-color:var(--accent);color:var(--accent)}
.fcheck{grid-column:1/-1}
.price{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.price small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.empty{padding:32px 0;color:var(--muted)}
.note{margin-top:24px;color:var(--muted);font-size:.85rem}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(10,16,36,.35);padding:14px 22px;border-radius:999px}
.login{max-width:360px;margin:18vh auto 0;padding:0 16px}
.login h1{font-size:1.6rem;margin-bottom:16px}
label{display:block;margin-top:12px;font-size:.9rem;color:var(--muted)}
input,select{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.check input{width:auto;margin-top:4px}
.backdrop{position:fixed;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.sheet-head h2{font-size:1.15rem}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:none;border-radius:10px}
.seg .on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.searchrow{display:flex;gap:8px}
.searchrow input{margin-top:0}
.results{list-style:none;padding:0;margin:12px 0 0}
.pick{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;text-align:left}
.pick img,.noimg{width:44px;height:61px;object-fit:contain;border-radius:4px;flex:none}
.noimg{background:var(--line)}
.pick small{display:block;color:var(--muted)}
.preview{display:flex;gap:14px;margin-top:12px}
.preview img{width:96px;height:auto;border-radius:6px;align-self:flex-start}
.preview p{margin:2px 0}
.hist{margin:12px 0}
.hist svg{width:100%;height:120px;display:block}
.range{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem;white-space:nowrap}
.filters{display:grid;gap:8px;margin:0 0 8px}
.filters input,.filters select{margin-top:0}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#fsort{grid-column:1/-1}
@media (min-width:600px){.frow{grid-template-columns:1fr 1.4fr 1fr}#fsort{grid-column:auto}}
.toggle{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:.9rem}
.toggle input{width:auto;margin:0}
.resultinfo{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:0 0 8px}
.resultinfo:empty{display:none}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:.9rem}
.sleeve .linkish{margin-top:6px}
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(8,12,24,.35);max-height:320px;overflow:auto}
.sug[hidden]{display:none}
.sug li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer}
.sug li.active,.sug li:hover{background:var(--bg)}
.sugtype{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;min-width:3.8em;text-align:center}
.suglabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugcount{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.wrap.wide{max-width:1080px}
.actions{align-items:center}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;background:none;border:1px solid var(--line);border-radius:10px}
.iconbtn svg{width:20px;height:20px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
.addtop{display:none}
@media (min-width:760px){.addtop{display:inline-flex;align-items:center;padding:9px 16px;border-radius:10px}.fab{display:none}}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:6;min-width:180px;margin:0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(8,12,24,.35)}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px}
.menu button:hover,.menu button:focus-visible{background:var(--bg)}
.status{margin:0 0 8px;color:var(--muted);font-size:.85rem}
.status:empty{display:none}
.sleeve{display:grid;gap:12px}
.sleeve .linkish{justify-self:start}
@media (min-width:760px){.sleeve{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:24px}}
.spark svg{width:100%;height:100px;display:block}
.spark .sub{margin:0}
.up{color:var(--up)}
.down{color:var(--down)}
.chg{font-size:.78rem;font-weight:500;color:var(--muted);white-space:nowrap}
.chg.up{color:var(--up)}
.chg.down{color:var(--down)}
.frow2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.vseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.vseg button{background:none;border:0;padding:7px 14px;font-size:.88rem;color:var(--muted)}
.vseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{list-style:none;margin:0;padding:12px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px;border-top:1px solid var(--line)}
.grid li{min-width:0}
.tile{display:flex;flex-direction:column;gap:5px;width:100%;min-width:0;background:none;border:0;padding:0;text-align:left}
.tile>*{min-width:0;max-width:100%}
.art{width:100%;aspect-ratio:63/88;border-radius:8px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.art img{width:100%;height:100%;object-fit:contain}
.noart{color:var(--muted);font-size:.8rem;padding:8px;text-align:center}
.tname{display:block;font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tset{display:block;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .meta{margin-top:0}
.tprice{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 6px;font-variant-numeric:tabular-nums}
.okmsg{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.dtop{display:grid;grid-template-columns:minmax(120px,40%) minmax(0,1fr);grid-template-areas:"art info" "stats stats";gap:14px 16px;align-items:start;margin-top:4px}
@media (min-width:600px){.dtop{grid-template-columns:240px minmax(0,1fr);grid-template-areas:"art info" "art stats";gap:10px 24px;align-content:start}}
.dart{grid-area:art;aspect-ratio:63/88;border-radius:10px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.dart img{width:100%;height:100%;object-fit:contain}
.dinfo{grid-area:info;display:flex;flex-direction:column;gap:6px;min-width:0}
.dinfo p{margin:0}
.dprice{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:6px!important}
.dsmall{font-size:.85rem}
.dstatswrap{grid-area:stats;min-width:0}
.dstats{margin:0}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.drow dt{color:var(--muted)}
.drow dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.dnote{margin:6px 0 0;color:var(--muted);font-size:.78rem}
.dsec h4{font-size:.85rem;margin:14px 0 2px;color:var(--muted);font-weight:600}
.drow small{color:var(--muted);font-size:.78rem}
.drow.mine dt{color:var(--ink);font-weight:600}
.dsec{margin-top:22px}
.dsec h3{font-size:.95rem;margin-bottom:6px}
.dsec .hist{margin:0}
.dform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dform label{margin-top:0}
.fcond{grid-column:1/-1}
@media (min-width:600px){.dform{grid-template-columns:1.4fr .7fr 1fr}.fcond{grid-column:auto}}
.dactions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.dangerlink{background:none;border:0;padding:8px 0;color:var(--danger);text-decoration:underline;text-underline-offset:2px}
.plines{list-style:none;padding:0;margin:12px 0 0}
.plines li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.plines small{grid-column:1/-1;color:var(--muted)}
</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(() => {
"use strict";

const SUPABASE_URL = "https://etybhxsxnovicwlsoiha.supabase.co";
const SUPABASE_KEY = "sb_publishable_L4T61xqNhqn9QyOYW_IGPg_I70TkeeL";
const TCGDEX = "https://api.tcgdex.net/v2";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = n => (n == null || Number.isNaN(n)) ? "–" : new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(n);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";

const CONDITIONS = [["MT", "Mint"], ["NM", "Near Mint"], ["EX", "Excellent"], ["GD", "Good"], ["LP", "Light Played"], ["PL", "Played"], ["PO", "Poor"]];
const SRC = {
  cm_trend: "Cardmarket-Trend (alle Sprachen)",
  cm_lang_floor: "Cardmarket-Angebote in deiner Sprache",
  ebay_sold: "eBay-Verkäufe in deiner Sprache"
};

const state = { cards: [], latest: {}, daily: [], view: "list", filter: { q: "", lang: "", set: "", missing: false, sort: "value" } };
const triedImages = new Set();
const YEAR_KEY = "kt_set_years_v1";
try { state.setYears = JSON.parse(localStorage.getItem(YEAR_KEY) || "{}") || {}; } catch (e) { state.setYears = {}; }
try { state.view = localStorage.getItem("kt_view") === "grid" ? "grid" : "list"; } catch (e) { /* Standard: Liste */ }

// Lädt ein deutsches Bild nicht, wird die englische Version derselben Karte versucht.
window.detailImgFallback = img => {
  if (img.src.includes("/high.")) { img.src = img.src.replace("/high.", "/low."); return; }
  window.imgFallback(img);
};

window.imgFallback = img => {
  if (!img.dataset.fb && img.src.includes("/de/")) {
    img.dataset.fb = "1";
    img.src = img.src.replace("/de/", "/en/");
  } else {
    img.style.visibility = "hidden";
  }
};

const condOptions = sel => CONDITIONS.map(([v, l]) => `<option value="${v}"${v === sel ? " selected" : ""}>${l} (${v})</option>`).join("");

async function tcg(path) {
  const res = await fetch(`${TCGDEX}/${path}`);
  if (!res.ok) throw new Error(`TCGdex antwortet mit Status ${res.status}`);
  return res.json();
}

async function imageFor(id, lang, own) {
  if (own) return `${own}/low.webp`;
  if (lang !== "EN") {
    try {
      const en = await tcg(`en/cards/${encodeURIComponent(id)}`);
      if (en.image) return `${en.image}/low.webp`;
    } catch (e) { /* kein Ersatzbild verfügbar */ }
  }
  return null;
}

async function repairImages() {
  const todo = state.cards.filter(c => !c.image_url && c.tcgdex_id && !triedImages.has(c.id));
  let changed = false;
  for (const c of todo) {
    triedImages.add(c.id);
    const url = await imageFor(c.tcgdex_id, c.language, null);
    if (!url) continue;
    const { error } = await db.from("cards").update({ image_url: url }).eq("id", c.id);
    if (!error) { c.image_url = url; changed = true; }
  }
  if (changed) renderMain();
}

// Welche Cardmarket-Felder gelten für eine Karte?
// Holo-Felder ("-holo") nur, wenn die Karte als Foil markiert ist UND es sie auch ohne Holo gibt.
// Reine Holo-Karten (z. B. Shining Kabutops) haben ihren Preis in den normalen Feldern.
function priceFields(tcgCard, foil) {
  const m = tcgCard && tcgCard.pricing && tcgCard.pricing.cardmarket;
  if (!m) return null;
  const v = tcgCard.variants;
  const plainExists = v && typeof v === "object" ? v.normal === true : true;
  const num = k => typeof m[k] === "number";
  let suffix = foil && plainExists ? "-holo" : "";
  if (!num("trend" + suffix)) {
    const alt = suffix ? "" : "-holo";
    if (!num("trend" + alt)) return null;
    suffix = alt;
  }
  return { m, suffix, trend: m["trend" + suffix], plainExists };
}

function trendOf(tcgCard, foil) {
  const f = priceFields(tcgCard, foil);
  return f ? f.trend : null;
}

async function saveSnapshot(card, tcgCard) {
  const f = priceFields(tcgCard, card.foil);
  if (!f) return false;
  const { m, suffix } = f;
  const details = {
    avg7: m["avg7" + suffix] ?? null,
    avg30: m["avg30" + suffix] ?? null,
    low: m["low" + suffix] ?? null,
    finish: suffix ? "foil" : "normal",
    updated: m.updated ?? null
  };
  const { error } = await db.from("price_snapshots").upsert(
    { card_id: card.id, captured_on: today(), source: "cm_trend", price_eur: f.trend, details },
    { onConflict: "card_id,captured_on,source" }
  );
  return !error;
}

/* ---------- Anmeldung ---------- */

function renderLogin(msg = "") {
  $("#app").innerHTML = `
    <main class="login">
      <h1>Karten-Tracker</h1>
      <input id="em" type="email" placeholder="E-Mail" autocomplete="username">
      <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" style="margin-top:10px">
      <button id="go" class="primary wide">Anmelden</button>
      <p class="err" id="err">${esc(msg)}</p>
    </main>`;
  const go = async () => {
    $("#err").textContent = "";
    const { error } = await db.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
    if (error) $("#err").textContent = "Anmeldung fehlgeschlagen: " + error.message;
  };
  $("#go").onclick = go;
  $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

/* ---------- Sammlung ---------- */

async function loadMain(opts = {}) {
  if (!opts.quiet) $("#app").innerHTML = `<p class="muted pad">Sammlung wird geladen …</p>`;
  const [c, l, d] = await Promise.all([
    db.from("cards").select("*").order("created_at", { ascending: false }),
    db.from("card_latest_prices").select("*"),
    db.from("collection_value_daily").select("captured_on,value_eur").order("captured_on", { ascending: true }).limit(400)
  ]);
  const err = c.error || l.error;
  if (err) {
    $("#app").innerHTML = `<p class="err pad">Fehler beim Laden: ${esc(err.message)}</p>`;
    return;
  }
  state.cards = c.data;
  state.latest = {};
  for (const r of l.data) {
    if (!state.latest[r.card_id]) state.latest[r.card_id] = {};
    state.latest[r.card_id][r.source] = r;
  }
  // Ohne update2.sql gibt es die Ansicht nicht: Kurve dann ausblenden, Rest läuft normal.
  state.daily = d.error ? null : (d.data || []);
  const y = window.scrollY;
  renderMain();
  if (opts.quiet) window.scrollTo(0, y);
  repairImages();
  loadSetYears();
}

function extraLines(p) {
  const out = [];
  if (p.cm_lang_floor) out.push(`Angebote ${eur(Number(p.cm_lang_floor.price_eur))}`);
  if (p.ebay_sold) out.push(`eBay ${eur(Number(p.ebay_sold.price_eur))}`);
  return out.join(", ");
}

const SORTS = [["value", "Sortieren: Wert"], ["name", "Sortieren: Name"], ["newest", "Sortieren: Neueste"]];
const norm = v => String(v ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function setIdOf(c) {
  const id = c.tcgdex_id;
  if (!id) return null;
  const suffix = c.card_number ? "-" + c.card_number : null;
  if (suffix && id.endsWith(suffix)) return id.slice(0, -suffix.length);
  const i = id.lastIndexOf("-");
  return i > 0 ? id.slice(0, i) : null;
}

function setYear(setName) {
  for (const c of state.cards) {
    if (c.set_name !== setName) continue;
    const y = state.setYears[setIdOf(c)];
    if (y) return y;
  }
  return "";
}

const setLabel = name => { const y = setYear(name); return y ? `${name} (${y})` : name; };

function setNames() {
  return [...new Set(state.cards.map(c => c.set_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
}

async function loadSetYears() {
  const todo = new Map();
  for (const c of state.cards) {
    const id = setIdOf(c);
    if (id && !(id in state.setYears) && !todo.has(id)) todo.set(id, c.language.toLowerCase());
  }
  if (!todo.size) return;
  let changed = false;
  for (const [id, lang] of todo) {
    let date = null, reached = false;
    for (const l of lang === "en" ? ["en"] : [lang, "en"]) {
      try {
        const set = await tcg(`${l}/sets/${encodeURIComponent(id)}`);
        reached = true;
        if (set && set.releaseDate) { date = set.releaseDate; break; }
      } catch (e) { /* nächste Sprache versuchen */ }
    }
    if (date) { state.setYears[id] = date.slice(0, 4); changed = true; }
    else if (reached) { state.setYears[id] = ""; changed = true; }
  }
  if (!changed) return;
  try { localStorage.setItem(YEAR_KEY, JSON.stringify(state.setYears)); } catch (e) { /* Speicher nicht verfügbar */ }
  updateSetOptions();
  if (state.filter.q.trim()) renderList();
}

function updateSetOptions() {
  const sel = $("#fset");
  if (!sel) return;
  const f = state.filter;
  sel.innerHTML = `<option value="">Alle Sets</option>` +
    setNames().map(v => `<option value="${esc(v)}"${v === f.set ? " selected" : ""}>${esc(setLabel(v))}</option>`).join("");
}

function suggestions(q) {
  const nq = norm(q).trim();
  const tokens = nq.split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  const match = label => { const h = norm(label); return tokens.every(t => h.includes(t)); };
  const score = label => (norm(label).startsWith(nq) ? 0 : 1);
  const count = (key, val) => state.cards.filter(c => c[key] === val).reduce((s, c) => s + c.quantity, 0);
  const bySc = (a, b) => score(a.label) - score(b.label) || a.label.localeCompare(b.label, "de");
  const sets = setNames().filter(n => match(setLabel(n)))
    .map(n => ({ type: "set", value: n, label: setLabel(n), n: count("set_name", n) })).sort(bySc).slice(0, 4);
  const names = [...new Set(state.cards.map(c => c.name))].filter(match)
    .map(n => ({ type: "name", value: n, label: n, n: count("name", n) })).sort(bySc).slice(0, 6);
  return [...sets, ...names];
}

function wireSuggestions(input) {
  const list = $("#fsug");
  const f = state.filter;
  let items = [], active = -1;
  const hide = () => {
    list.hidden = true;
    input.setAttribute("aria-expanded", "false");
    input.removeAttribute("aria-activedescendant");
    active = -1;
  };
  const paint = () => {
    list.querySelectorAll("li").forEach((li, i) => li.classList.toggle("active", i === active));
    if (active >= 0) input.setAttribute("aria-activedescendant", `sug-${active}`);
    else input.removeAttribute("aria-activedescendant");
  };
  const show = () => {
    items = suggestions(input.value);
    active = -1;
    if (!items.length) return hide();
    list.innerHTML = items.map((s, i) => `<li id="sug-${i}" role="option" data-i="${i}">
      <span class="sugtype">${s.type === "set" ? "Set" : "Karte"}</span>
      <span class="suglabel">${esc(s.label)}</span>
      <span class="sugcount">${s.n} ${s.n === 1 ? "Karte" : "Karten"}</span></li>`).join("");
    list.hidden = false;
    input.setAttribute("aria-expanded", "true");
  };
  const choose = s => {
    if (s.type === "set") {
      f.set = s.value;
      f.q = "";
      input.value = "";
      const sel = $("#fset");
      if (sel) sel.value = s.value;
    } else {
      f.q = s.value;
      input.value = s.value;
    }
    hide();
    renderList();
  };
  input.addEventListener("input", () => { f.q = input.value; renderList(); show(); });
  input.addEventListener("focus", show);
  input.addEventListener("blur", () => setTimeout(hide, 150));
  input.addEventListener("keydown", e => {
    if (list.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); active = (active + 1) % items.length; paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = active <= 0 ? items.length - 1 : active - 1; paint(); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); choose(items[active]); }
    else if (e.key === "Escape") { hide(); }
  });
  list.addEventListener("mousedown", e => e.preventDefault());
  list.addEventListener("click", e => {
    const li = e.target.closest("li[data-i]");
    if (li) choose(items[Number(li.dataset.i)]);
  });
}

const pctFmt = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtPct = v => `${v > 0 ? "+" : v < 0 ? "−" : "±"}${pctFmt.format(Math.abs(v))} %`;
const signedEur = v => `${v > 0 ? "+" : v < 0 ? "−" : ""}${eur(Math.abs(v))}`;
const trendCls = v => (v > 0.05 ? "up" : v < -0.05 ? "down" : "");

// Abweichung des aktuellen Trends vom 7- bzw. 30-Tage-Durchschnitt (beides von Cardmarket über TCGdex)
function changeInfo(p) {
  const r = p.cm_trend;
  if (!r || !r.details) return null;
  const now = Number(r.price_eur);
  const pct = avg => {
    const a = avg == null ? null : Number(avg);
    return a && a > 0 ? (now - a) / a * 100 : null;
  };
  return { d7: pct(r.details.avg7), d30: pct(r.details.avg30) };
}

function chgHtml(v, label) {
  if (v == null || !isFinite(v)) return "";
  return `<small class="chg ${trendCls(v)}">${label} ${fmtPct(v)}</small>`;
}

function gainOf(rows) {
  let gain = 0, cost = 0, n = 0;
  for (const { c, unit } of rows) {
    if (c.purchase_price_eur == null || unit == null) continue;
    const pp = Number(c.purchase_price_eur);
    gain += (unit - pp) * c.quantity;
    cost += pp * c.quantity;
    n++;
  }
  return n ? { gain, n, pct: cost > 0 ? gain / cost * 100 : null } : null;
}

function fmtRange(a, b) {
  const sameYear = a.slice(0, 4) === b.slice(0, 4);
  const short = d => new Date(d + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  return sameYear ? `${short(a)} bis ${fmtDate(b)}` : `${fmtDate(a)} bis ${fmtDate(b)}`;
}

function lineChart(points, getV, aria) {
  const W = 320, H = 110, pad = 6;
  const ys = points.map(getV);
  const min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
  const x = i => pad + (i / (points.length - 1)) * (W - 2 * pad);
  const y = v => H - pad - ((v - min) / span) * (H - 2 * pad);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(getV(p)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(aria)}"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="range"><span>${eur(min)}</span><span>${fmtRange(points[0].captured_on, points[points.length - 1].captured_on)}</span><span>${eur(max)}</span></div>`;
}

function totalChart() {
  if (state.daily === null) return `<p class="sub">Für die Wertkurve einmal update2.sql in Supabase ausführen.</p>`;
  if (state.daily.length < 2) return `<p class="sub">Die Wertkurve erscheint ab dem zweiten Tag mit Preisdaten.</p>`;
  return lineChart(state.daily, p => Number(p.value_eur), "Gesamtwert der Sammlung im Zeitverlauf") +
    `<p class="sub">Sprünge entstehen auch durch neu hinzugefügte Karten.</p>`;
}

function cardRows() {

    return { c, p, unit, total: unit == null ? null : unit * c.quantity };
  });
}

  return true;
}

function filterActive(f) {
  return Boolean(f.q.trim() || f.lang || f.set || f.missing);
}

function resetFilters() {
  Object.assign(state.filter, { q: "", lang: "", set: "", missing: false });
  const fq = $("#fq");
  if (fq) fq.value = "";
  for (const sel of ["#flang", "#fset"]) { const el = $(sel); if (el) el.value = ""; }
  const fm = $("#fmissing");
  if (fm) fm.checked = false;
  const sg = $("#fsug");
  if (sg) { sg.hidden = true; if (fq) fq.setAttribute("aria-expanded", "false"); }
  renderList();
}

function renderList() {
  const wrap = $("#listwrap");
  if (!wrap) return;
  if (!state.cards.length) {
    wrap.innerHTML = `<p class="empty">Noch keine Karten. Tippe auf „Karte hinzufügen“ und suche nach dem Namen.</p>`;
    return;
  }
  const f = state.filter;
  const tokens = norm(f.q).split(/\s+/).filter(Boolean);
  const years = new Map(setNames().map(n => [n, setYear(n)]));
  const rows = cardRows().filter(({ c, unit }) => {
    if (f.lang && c.language !== f.lang) return false;
    if (f.set && c.set_name !== f.set) return false;
    if (f.missing && unit != null) return false;
    if (tokens.length) {
      const hay = norm(`${c.name} ${c.set_name || ""} ${c.card_number || ""} ${years.get(c.set_name) || ""} ${c.first_edition ? "1st edition first edition" : ""}`);
      if (!tokens.every(t => hay.includes(t))) return false;
    }
    return true;
  });
  const sorters = {
    value: (a, b) => (b.total ?? -1) - (a.total ?? -1),
    name: (a, b) => a.c.name.localeCompare(b.c.name, "de"),
    newest: (a, b) => String(b.c.created_at).localeCompare(String(a.c.created_at))
  };
  rows.sort(sorters[f.sort] || sorters.value);

  const info = $("#resinfo");
  if (info) {
    if (filterActive(f)) {
      const n = rows.reduce((s, r) => s + r.c.quantity, 0);
      const v = rows.reduce((s, r) => s + (r.total ?? 0), 0);
      info.innerHTML = `<span>${n} ${n === 1 ? "Karte" : "Karten"} gefunden, Wert ${eur(v)}</span><button class="linkish" id="freset">Filter zurücksetzen</button>`;
      $("#freset").onclick = resetFilters;
    } else {
      info.innerHTML = "";
    }
  }
  wrap.innerHTML = !rows.length
    ? `<p class="empty">Keine Karte passt zu deiner Suche.</p>`
    : state.view === "grid"
      ? `<ul class="grid">${rows.map(tileHtml).join("")}</ul>`
      : `<ul class="list">${rows.map(rowHtml).join("")}</ul>`;
}

async function refreshAll() {
  const btn = $("#refresh");
  if (!btn || btn.disabled) return;
  const queue = state.cards.filter(c => c.tcgdex_id);
  const total = queue.length;
  if (!total) return;
  btn.disabled = true;
  btn.classList.add("spin");
  let done = 0;
  const setStatus = t => { const st = $("#status"); if (st) st.textContent = t; };
  setStatus(`Preise werden aktualisiert: 0 von ${total}`);
  const worker = async () => {
    while (queue.length) {
      const c = queue.shift();
      try {
        const t = await tcg(`${c.language.toLowerCase()}/cards/${encodeURIComponent(c.tcgdex_id)}`);
        await saveSnapshot(c, t);
      } catch (e) { /* einzelne Fehler überspringen */ }
      done++;
      setStatus(`Preise werden aktualisiert: ${done} von ${total}`);
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  await loadMain({ quiet: true });
  setStatus("Preise aktualisiert.");
  setTimeout(() => { const st = $("#status"); if (st && st.textContent === "Preise aktualisiert.") st.textContent = ""; }, 4000);
}

const cardCache = {};
function liveCard(lang, id) {
  const k = lang + "/" + id;
  if (!cardCache[k]) cardCache[k] = tcg(`${lang}/cards/${encodeURIComponent(id)}`).catch(e => { delete cardCache[k]; throw e; });
  return cardCache[k];
}

const TP_LABELS = [
  ["1st-edition-holofoil", "1st Edition Holo"], ["1st-edition", "1st Edition"],

  try {
    const own = await liveCard(c.language.toLowerCase(), c.tcgdex_id);
    let en = own;
    if (c.language !== "EN") { try { en = await liveCard("en", c.tcgdex_id); } catch (e) { en = own; } }
    if (!$("#live", sheet)) return;

    // Cardmarket (EUR)
    const m = own.pricing && own.pricing.cardmarket;
    const f = priceFields(own, c.foil);
    const std = m && typeof m.trend === "number" ? m.trend : null;
    const holo = m && typeof m["trend-holo"] === "number" ? m["trend-holo"] : null;
    const why = !f ? "" : f.suffix
      ? (c.foil ? "Foil-Karte mit Nicht-Holo-Version: Es gilt der Holo-Trend." : "Der normale Trend ist nicht verfügbar, deshalb gilt der Holo-Trend.")
      : (c.foil && !f.plainExists ? "Diese Karte gibt es nur als Holo: Es gilt der normale Trend." : "Es gilt der normale Trend.");
    const cmRows = [
      std != null ? `<div class="drow${f && !f.suffix ? " mine" : ""}"><dt>Normaler Trend</dt><dd>${eur(std)}</dd></div>` : "",
      holo != null ? `<div class="drow${f && f.suffix ? " mine" : ""}"><dt>Holo-Trend</dt><dd>${eur(holo)}</dd></div>` : ""
    ].join("");

    // TCGplayer (USD), englische Karte
    const tp = (en.pricing && en.pricing.tcgplayer) || (own.pricing && own.pricing.tcgplayer) || null;
    let tpRows = [];
    if (tp) {
      const known = TP_LABELS.map(([k]) => k);
      const keys = [...TP_LABELS.filter(([k]) => tp[k] && typeof tp[k] === "object").map(([k, l]) => [k, l]),
        ...Object.keys(tp).filter(k => !known.includes(k) && tp[k] && typeof tp[k] === "object").map(k => [k, k])];
      const isFirst = k => k.startsWith("1st-edition");
      keys.sort((a, b) => (c.first_edition ? Number(!isFirst(a[0])) - Number(!isFirst(b[0])) : Number(isFirst(a[0])) - Number(isFirst(b[0]))));
      tpRows = keys.map(([k, label]) => {
        const v = tp[k];
        if (v.marketPrice == null && v.lowPrice == null) return "";
        return `<div class="drow"><dt>${esc(label)}</dt><dd>${usd(v.marketPrice)}${v.lowPrice != null ? ` <small>ab ${usd(v.lowPrice)}</small>` : ""}</dd></div>`;
      }).filter(Boolean);
    }
    box.innerHTML = `
      <h4>Cardmarket, Euro</h4>
      ${cmRows ? `<dl class="dstats">${cmRows}</dl><p class="dnote">${esc(why)} Der Cardmarket-Trend gilt für das Produkt und ist nach bisherigem Stand nicht nach Edition getrennt.</p>` : `<p class="muted dsmall">Kein Cardmarket-Preis vorhanden.</p>`}
      <h4>TCGplayer, US-Dollar</h4>
      ${tpRows.length
        ? `<dl class="dstats">${tpRows.join("")}</dl><p class="dnote">US-Markt, Daten der englischen Karte${c.language !== "EN" ? " (deine Karte ist " + (c.language === "DE" ? "deutsch" : esc(c.language)) + ")" : ""}. Marktpreis, daneben der niedrigste Angebotspreis.${c.first_edition ? " Die 1st-Edition-Zeilen stehen oben, weil du die Karte so markiert hast." : ""}</p>`
        : `<p class="muted dsmall">Für diese Karte liegen bei TCGplayer keine Preise vor.</p>`}`;
  } catch (e) {
    const b = $("#live", sheet);
    if (b) b.innerHTML = `<p class="muted dsmall">Die Preise nach Ausführung konnten nicht geladen werden.</p>`;
  }
}

const setsCache = {};
function setsFor(lang) {
  if (!setsCache[lang]) setsCache[lang] = tcg(`${lang}/sets`).catch(e => { delete setsCache[lang]; throw e; });
  return setsCache[lang];
}

function setIdFromCardId(id, localId) {
  const suffix = localId != null ? "-" + localId : null;
  if (suffix && id.endsWith(suffix)) return id.slice(0, -suffix.length);
  const i = id.lastIndexOf("-");
  return i > 0 ? id.slice(0, i) : id;
}

function openAdd() {
  const s = { lang: "DE", picked: null, results: [] };
  const sheet = openSheet(`
    <header class="sheet-head"><h2>Karte hinzufügen</h2><button class="ghost" data-close>Fertig</button></header>
    <div class="seg" id="langseg"><button data-l="DE" class="on">Deutsch</button><button data-l="EN">Englisch</button></div>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Name oder Nummer, z. B. Mewtu oder 6/105" enterkeyhint="search" autocomplete="off">
      <button id="sbtn" class="primary">Suchen</button>
    </div>
    <div id="res"></div>`);

  const res = $("#res", sheet);
  const lang = () => s.lang.toLowerCase();

  sheet.querySelectorAll("#langseg button").forEach(b => b.onclick = () => {
    s.lang = b.dataset.l;
    sheet.querySelectorAll("#langseg button").forEach(x => x.classList.toggle("on", x === b));
    res.innerHTML = "";
    s.picked = null;
    s.results = [];
  });

  function showResults(list, msg) {
    s.results = list;
    const yr = id => state.setYears[id] ? ` (${state.setYears[id]})` : "";
    res.innerHTML = `${msg ? `<p class="okmsg" role="status">${esc(msg)}</p>` : ""}${list.length ? `<ul class="results">${list.map(c => {
      const sid = setIdFromCardId(c.id, c.localId);
      return `<li><button class="pick" data-id="${esc(c.id)}">
        ${c.image ? `<img src="${esc(c.image)}/low.webp" alt="" loading="lazy" onerror="imgFallback(this)">` : `<span class="noimg"></span>`}
        <span><b>${esc(c.name)}</b><small>${esc(c.setName || sid)}${yr(sid)}, Nr. ${esc(c.localId)}</small></span></button></li>`;
    }).join("")}</ul>` : ""}`;
    res.querySelectorAll(".pick").forEach(b => b.onclick = () => pick(b.dataset.id));
  }

  async function search() {
    const raw = $("#q", sheet).value.trim();
    const num = raw.match(/(\d+)\s*\/\s*(\d+)/);
    if (num) return searchByNumber(num[1], Number(num[2]), raw.replace(num[0], "").trim());
    if (raw.length < 2) return;
    res.innerHTML = `<p class="muted">Suche läuft …</p>`;
    try {
      const [list, sets] = await Promise.all([
        tcg(`${lang()}/cards?name=${encodeURIComponent(raw)}&pagination:page=1&pagination:itemsPerPage=40`),
        setsFor(lang()).catch(() => [])
      ]);
      if (!list.length) {
        res.innerHTML = `<p class="muted">Keine Treffer. Probiere einen kürzeren Namen, die Kartennummer (z. B. 6/105) oder die andere Sprache.</p>`;
        return;
      }
      const byId = new Map(sets.map(x => [x.id, x.name]));
      showResults(list.map(c => ({ ...c, setName: byId.get(setIdFromCardId(c.id, c.localId)) })));
    } catch (e) {
      res.innerHTML = `<p class="err">Suche fehlgeschlagen: ${esc(e.message)}</p>`;
    }
  }

  // "6/105": Karte Nr. 6 aus einem Set mit 105 offiziellen Karten
  async function searchByNumber(localNum, official, nameFilter) {
    res.innerHTML = `<p class="muted">Suche nach Nr. ${esc(localNum)}/${official} …</p>`;
    try {
      const sets = await setsFor(lang());
      const cands = sets.filter(x => x.cardCount && Number(x.cardCount.official) === official).slice(0, 12);
      if (!cands.length) {
        res.innerHTML = `<p class="muted">Kein Set mit ${official} Karten gefunden. Prüfe die Nummer oder die Sprache.</p>`;
        return;
      }
      const variants = [...new Set([localNum, localNum.replace(/^0+(?=\d)/, ""), localNum.padStart(3, "0")])];
      const found = [];
      for (const set of cands) {
        for (const v of variants) {
          try {
            const card = await tcg(`${lang()}/cards/${encodeURIComponent(`${set.id}-${v}`)}`);
            if (card && card.id) { found.push({ id: card.id, name: card.name, image: card.image, localId: card.localId, setName: set.name }); break; }
          } catch (e) { /* diese Schreibweise gibt es nicht, nächste probieren */ }
        }
      }
      const nf = norm(nameFilter);
      const list = nf ? found.filter(c => norm(c.name).includes(nf)) : found;
      if (!list.length) {
        res.innerHTML = `<p class="muted">Keine Karte Nr. ${esc(localNum)}/${official} gefunden.</p>`;
        return;
      }
      showResults(list);
    } catch (e) {
      res.innerHTML = `<p class="err">Suche fehlgeschlagen: ${esc(e.message)}</p>`;
    }
  }

  async function pick(id) {
    res.innerHTML = `<p class="muted">Karte wird geladen …</p>`;
    try {
      const c = await tcg(`${lang()}/cards/${encodeURIComponent(id)}`);
      s.picked = c;
      s.imageUrl = await imageFor(c.id, s.lang, c.image);
      const v = c.variants || {};
      const foilOnly = !v.normal && (v.holo || v.reverse);
      const m = c.pricing && c.pricing.cardmarket;
      const priceText = m && typeof m.trend === "number"
        ? `Cardmarket-Trend ${eur(m.trend)}${typeof m["trend-holo"] === "number" ? `, Holo-Feld ${eur(m["trend-holo"])}` : ""}`
        : (m && typeof m["trend-holo"] === "number" ? `Cardmarket-Holo-Trend ${eur(m["trend-holo"])}` : "Kein Cardmarket-Preis vorhanden");
      const sid = c.set && c.set.id;
      const year = sid && state.setYears[sid] ? ` (${state.setYears[sid]})` : "";
      res.innerHTML = `
        ${s.results.length ? `<button class="linkish" id="back">Zurück zu den Treffern</button>` : ""}
        <div class="preview">
          ${s.imageUrl ? `<img src="${esc(s.imageUrl)}" alt="" onerror="imgFallback(this)">` : ""}
          <div>
            <h3>${esc(c.name)}</h3>
            <p class="muted">${esc(c.set && c.set.name || "")}${year}, Nr. ${esc(c.localId)}</p>
            <p class="muted">${esc(c.rarity || "")}</p>
            <p>${esc(priceText)}</p>
          </div>
        </div>
        <label>Zustand<select id="cond">${condOptions("NM")}</select></label>
        <label>Menge<input id="qty" type="number" min="1" value="1" inputmode="numeric"></label>
        <label class="check"><input id="foil" type="checkbox"${foilOnly ? " checked" : ""}> <span>Holo oder Reverse Holo<br><small class="muted">Gibt es die Karte auch ohne Holo, gilt der Foil-Preis. Reine Holo-Karten nutzen den normalen Cardmarket-Trend.</small></span></label>
        <p class="muted dsmall" id="pline"></p>
        <label class="check"><input id="first" type="checkbox"> <span>1st Edition${v.firstEdition ? " (für diese Karte ist ein 1st-Edition-Druck bekannt)" : ""}<br><small class="muted">Nur eine Markierung, der Preis ändert sich dadurch nicht.</small></span></label>
        <label>Kaufpreis pro Karte in EUR (optional)<input id="pp" type="number" min="0" step="0.01" inputmode="decimal"></label>
        <button id="save" class="primary wide">Zur Sammlung hinzufügen</button>
        <p class="err" id="saveerr"></p>`;
      const showUsed = () => {
        const f = priceFields(c, $("#foil", sheet).checked);
        const pl = $("#pline", sheet);
        if (pl) pl.textContent = f
          ? `Verwendeter Preis: ${eur(f.trend)} (${f.suffix ? "Holo-Feld" : "normaler Trend"})`
          : "Verwendeter Preis: keiner verfügbar";
      };
      $("#foil", sheet).onchange = showUsed;
      showUsed();
      $("#save", sheet).onclick = save;
      const back = $("#back", sheet);
      if (back) back.onclick = () => showResults(s.results);
    } catch (e) {
      res.innerHTML = `<p class="err">Karte konnte nicht geladen werden: ${esc(e.message)}</p>`;
    }
  }

  async function save() {
    const c = s.picked;
    const btn = $("#save", sheet);
    btn.disabled = true;
    const pp = $("#pp", sheet).value;
    const row = {
      name: c.name,
      set_name: (c.set && c.set.name) || null,
      card_number: String(c.localId),
      language: s.lang,
      condition: $("#cond", sheet).value,
      quantity: Math.max(1, parseInt($("#qty", sheet).value, 10) || 1),
      purchase_price_eur: pp === "" ? null : Number(pp),
      tcgdex_id: c.id,
      image_url: s.imageUrl,
      foil: $("#foil", sheet).checked
    };
    if ($("#first", sheet).checked) row.first_edition = true;
    const { data, error } = await db.from("cards").insert(row).select().single();
    if (error) {
      $("#saveerr", sheet).textContent = /first_edition/.test(error.message)
        ? "Bitte zuerst update3.sql in Supabase ausführen, dann erneut speichern."
        : "Speichern fehlgeschlagen: " + error.message;
      btn.disabled = false;
      return;
    }
    await saveSnapshot(data, c);
    loadMain({ quiet: true });
    s.picked = null;
    showResults(s.results, `${c.name} wurde hinzugefügt. Du kannst direkt die nächste Karte wählen oder suchen.`);
    const q = $("#q", sheet);
    if (q) q.select();
  }

  $("#sbtn", sheet).onclick = search;
  $("#q", sheet).addEventListener("keydown", e => { if (e.key === "Enter") search(); });
  $("#q", sheet).focus();
}

/* ---------- Kartendetails ---------- */

function chart(points) {
  if (points.length < 2) return `<p class="muted">Der Verlauf entsteht ab dem zweiten Tag mit Preisdaten.</p>`;
  return lineChart(points, p => Number(p.price_eur), "Preisverlauf des Cardmarket-Trends");
}

async function openDetail(id) {
  const c = state.cards.find(x => x.id === id);
  if (!c) return;
  const p = state.latest[id] || {};
  const r = p.cm_trend;
  const unit = r ? Number(r.price_eur) : null;
  const ci = changeInfo(p);
  const pp = c.purchase_price_eur != null ? Number(c.purchase_price_eur) : null;
  const year = c.set_name ? setYear(c.set_name) : "";
  const big = c.image_url ? c.image_url.replace(/\/low\.(webp|png|jpg)$/, "/high.$1") : null;

  const row = (label, value) => `<div class="drow"><dt>${label}</dt><dd>${value}</dd></div>`;
  const pct = v => (v == null ? "" : ` <span class="${trendCls(v)}">(${fmtPct(v)})</span>`);
  const stats = [];
  if (r && r.details && r.details.avg7 != null) stats.push(row("Ø 7 Tage", eur(Number(r.details.avg7)) + pct(ci && ci.d7)));
  if (r && r.details && r.details.avg30 != null) stats.push(row("Ø 30 Tage", eur(Number(r.details.avg30)) + pct(ci && ci.d30)));
  if (p.cm_lang_floor) stats.push(row(SRC.cm_lang_floor, eur(Number(p.cm_lang_floor.price_eur))));
  if (p.ebay_sold) stats.push(row(SRC.ebay_sold, eur(Number(p.ebay_sold.price_eur))));
  if (pp != null) stats.push(row("Kaufpreis pro Karte", eur(pp)));
  if (pp != null && unit != null) {
    const g = (unit - pp) * c.quantity;
    stats.push(row("Gewinn/Verlust", `<span class="${trendCls(g)}">${signedEur(g)}${pp > 0 ? ` (${fmtPct((unit - pp) / pp * 100)})` : ""}</span>`));
  }
  const hasPct = ci && (ci.d7 != null || ci.d30 != null);

  const priceBlock = unit == null
    ? `<p class="dprice">Kein Preis</p><p class="muted dsmall">Für diese Karte liegt noch kein Cardmarket-Preis vor.</p>`
    : `<p class="dprice">${eur(unit * c.quantity)}</p>
       <p class="muted dsmall">${c.quantity > 1 ? `${c.quantity} × ${eur(unit)}, ` : ""}Cardmarket-Trend (alle Sprachen), Stand ${fmtDate(r.captured_on)}</p>`;

  const sheet = openSheet(`
    <header class="sheet-head"><h2>${esc(c.name)}</h2><button class="ghost" data-close>Schließen</button></header>
    <div class="dtop">
      <div class="dart">${big
        ? `<img src="${esc(big)}" alt="${esc(c.name)}" onerror="detailImgFallback(this)">`
        : `<span class="noart">Kein Bild verfügbar</span>`}</div>
      <div class="dinfo">
        <p class="muted">${esc(c.set_name || "")}${year ? ` (${year})` : ""}${c.card_number ? `, Nr. ${esc(c.card_number)}` : ""}</p>
        <div class="meta"><span class="tag">${esc(c.language)}</span><span class="tag">${esc(c.condition)}</span>${c.foil ? `<span class="tag foil">Foil</span>` : ""}${c.first_edition ? `<span class="tag first">1st Ed.</span>` : ""}${c.quantity > 1 ? `<span class="tag">${c.quantity}×</span>` : ""}</div>
        ${priceBlock}
        ${c.first_edition ? `<p class="dnote">Markiert als 1st Edition. Der Cardmarket-Trend bildet die 1st Edition nicht zwingend ab und kann abweichen.</p>` : ""}
      </div>
      ${stats.length ? `<div class="dstatswrap"><dl class="dstats">${stats.join("")}</dl>${hasPct ? `<p class="dnote">Prozentwerte: heutiger Trend gegenüber dem jeweiligen Durchschnitt.</p>` : ""}</div>` : ""}
    </div>
    <section class="dsec">
      <h3>Preisverlauf</h3>
      <div class="hist" id="hist"><p class="muted">Verlauf wird geladen …</p></div>
    </section>
    <section class="dsec">
      <h3>Preise nach Ausführung</h3>
      <div id="live"><p class="muted dsmall">Wird geladen …</p></div>
    </section>
    <section class="dsec">
      <h3>Bearbeiten</h3>
      <div class="dform">
        <label class="fcond">Zustand<select id="cond">${condOptions(c.condition)}</select></label>
        <label>Menge<input id="qty" type="number" min="1" value="${c.quantity}" inputmode="numeric"></label>
        <label>Kaufpreis pro Karte in €<input id="pp" type="number" min="0" step="0.01" inputmode="decimal" value="${pp != null ? pp : ""}" placeholder="optional"></label>
        <label class="check fcheck"><input id="first" type="checkbox"${c.first_edition ? " checked" : ""}> 1st Edition</label>
      </div>
      <div class="dactions">
        <button id="del" class="dangerlink">Karte löschen</button>
        <button id="upd" class="primary">Änderungen speichern</button>
      </div>
      <p class="err" id="derr"></p>
    </section>`);

  renderLive(sheet, c);

  $("#upd", sheet).onclick = async () => {
    const ppv = $("#pp", sheet).value;
    const patch = {
      condition: $("#cond", sheet).value,
      quantity: Math.max(1, parseInt($("#qty", sheet).value, 10) || 1),
      purchase_price_eur: ppv === "" ? null : Number(ppv)
    };
    // Die Spalte nur senden, wenn sich der Wert ändert: so funktioniert Speichern auch vor update3.sql
    const fe = $("#first", sheet).checked;
    if (fe !== Boolean(c.first_edition)) patch.first_edition = fe;
    const { error } = await db.from("cards").update(patch).eq("id", id);
    if (error) {
      $("#derr", sheet).textContent = /first_edition/.test(error.message)
        ? "Bitte zuerst update3.sql in Supabase ausführen, dann erneut speichern."
        : "Speichern fehlgeschlagen: " + error.message;
      return;
    }
    closeSheet();
    await loadMain({ quiet: true });
  };

  $("#del", sheet).onclick = async () => {
    if (!confirm("Karte wirklich löschen? Der Preisverlauf wird mit gelöscht.")) return;
    const { error } = await db.from("cards").delete().eq("id", id);
    if (error) { $("#derr", sheet).textContent = "Löschen fehlgeschlagen: " + error.message; return; }
    closeSheet();
    await loadMain({ quiet: true });
  };

  const { data, error } = await db.from("price_snapshots")
    .select("captured_on,price_eur")
    .eq("card_id", id).eq("source", "cm_trend")
    .order("captured_on", { ascending: true }).limit(365);
  const hist = $("#hist", sheet);
  if (hist) hist.innerHTML = error ? `<p class="err">Verlauf konnte nicht geladen werden.</p>` : chart(data);
}

/* ---------- Start ---------- */

document.addEventListener("click", e => { if (!e.target.closest(".menuwrap")) closeMenu(false); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (closeMenu(true)) return;
  if ($("#sheet")) closeSheet();
});

let uid = null;
db.auth.onAuthStateChange((event, session) => {
  const id = session && session.user ? session.user.id : null;
  if (id === uid && event !== "INITIAL_SESSION") return;
  uid = id;
  setTimeout(() => { id ? loadMain() : renderLogin(); }, 0);
});
})();
