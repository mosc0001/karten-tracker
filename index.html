  if (/heavily played|stark bespielt|\bpoor\b|schlecht|\bhp\b|damaged|\bdmg\b|beschadigt|crease/.test(t)) found.add("HP");
  if (/moderately played|ma(ss|ß)ig bespielt|moderat|very good|sehr gut|\bvg\b|\bmp\b/.test(t)) found.add("MP");
  if (/lightly played|light play|leicht bespielt|exzellent|excellent|\bexc?\+?\b|\blp\+?\b/.test(t)) found.add("LP");
  if (/near mint|fast neuwertig|neuwertig|\bnm\b|\bmint\b/.test(t)) found.add("NM");
  return STAGES.filter((x) => found.has(x));
}

const UNGRADED_RX = /ungraded|nicht bewertet|non gradat|non gradee|non grade|sin graduar|no calificad|niet gegradeerd/;
const GRADED_COND_RX = /^(graded|bewertet|gradata|gradee|calificad|gegradeerd)/;
const GRADED_TITLE_RX = new RegExp(
  [
    "\\b(psa|bgs|cgc|gsg|sgc|tag|ace|aog|mnt|hga|pca|gma|gg)\\s?-?\\s?\\d",
    "\\b(psa|bgs|cgc|beckett|gsg|sgc|aog|slab|slabbed|graded|gradata|gradee|bewertet|get graded)\\b",
  ].join("|")
);
const MULTI_TITLE_RX = /\b(trio|big 3|you choose|choose|all \d+|alle \d+|lot|bundle|konvolut|sammlung|set of|\d+x|x\d+)\b/;

/* ---------- Sprache ---------- */
function langFromField(v) {
  const t = norm(v);
  if (/german|deutsch|allemand|tedesco|aleman/.test(t)) return "DE";
  if (/english|englisch|inglese|anglais|ingles/.test(t)) return "EN";
  if (/ital/.test(t)) return "IT";
  if (/fran[cz]|french|franz/.test(t)) return "FR";
  if (/japan|giapp/.test(t)) return "JP";
  if (/span|spagn|espan/.test(t)) return "ES";
  return t.trim() ? "OTHER" : null;
}

function langFromTitle(title) {
  const t = norm(title);
  const hits = new Set();
  if (/\b(deutsch|deutsche|german|germany)\b|\bger\b|\bbasis[- ]?set\b|\b\d+ ?kp\b/.test(t) || /\bDE\b/.test(title)) hits.add("DE");
  if (/\b(ita|italiano|italian|italiana|italienisch|edizione|prima edizione|carta|rara)\b|\bset base\b|\b\d+ ?ps\b/.test(t)) hits.add("IT");
  if (/\b(francais|french|franzosisch)\b/.test(t)) hits.add("FR");
  if (/\b(espanol|spanish|spanisch)\b/.test(t)) hits.add("ES");
  if (/\b(japanese|japanisch|japan|jpn|jap)\b/.test(t)) hits.add("JP");
  if (/\b(english|englisch)\b/.test(title.toLowerCase()) || /\bENG?\b/.test(title)) hits.add("EN");
  return hits.size === 1 ? [...hits][0] : null;
}

/* ---------- Edition, Druck, Ausführung ---------- */
const FIRST_RX = /\b1st\b|\b1\.? ?edition\b|first edition|erstausgabe|erstauflage|prima edizione|\b1 ?edizione|edizione 1|\b1(e|ere) edition|premiere edition|primera edicion|1a edizione/;
const UNLIMITED_RX = /\bunlimited\b|unlimitiert/;

function finishFromText(s, isField = false) {
  const t = norm(s);
  if (/reverse|\brevers\b|umgekehrt|\brev\.? ?holo|\brh\b|rev[- ]?foil/.test(t)) return "reverse_holo";
  if (/non[- ]?holo|nicht holo|no holo|ohne holo|non[- ]?foil|non olograf/.test(t)) return "non_holo";
  if (isField && /\b(regular|normal|standard)\b/.test(t)) return "non_holo";
  if (/\bholo(foil)?\b|olograf|holographic|\bfoil\b/.test(t)) return "holo";
  return null;
}

/* ---------- Datum ---------- */
const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
function parseSoldAt(row, detail) {
  const m = String(row.soldDate ?? "").match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),\s*(\d{4})/);
  if (m && MONTHS[m[1].toLowerCase()] !== undefined) {
    return new Date(Date.UTC(Number(m[3]), MONTHS[m[1].toLowerCase()], Number(m[2]), 12)).toISOString();
  }
  if (detail && detail.endDate && (detail.sold || detail.listingStatus === "ENDED")) return new Date(detail.endDate).toISOString();
  return null;
}

// Vorschaubild des Angebots (bleibt sichtbar, auch wenn das Angebot bei eBay verschwunden ist)
const EBAY_IMG = /^https:\/\/i\.ebayimg\.com\/[^\s"'<>]+$/;
function pickImage(row, detail) {
  const cands = [row && row.image, detail && Array.isArray(detail.images) && detail.images[0], detail && detail.image];
  for (const c of cands) if (typeof c === "string" && EBAY_IMG.test(c)) return c;
  return null;
}

/* ========================================================================
   parseSale: aus einer Suchzeile (und, falls vorhanden, der Artikelseite) die Merkmale lesen
   ======================================================================== */
function parseSale(row, detail = null) {
  const detailTitle = detail && (typeof detail.title === "string" ? detail.title : detail.title && detail.title.mainTitle);
  const title = String(row.title ?? detailTitle ?? "");
  const sp = (detail && detail.itemSpecifics) || {};
  const condRaw = detail && typeof detail.condition === "string" ? detail.condition : "";
  const condN = norm(condRaw);
  const conflicts = [];

  // bewertet / ungradet
  let graded = false;
  let gradedReason = null;
  if (GRADED_TITLE_RX.test(norm(title))) { graded = true; gradedReason = "title"; }
  if (condRaw) {
    if (UNGRADED_RX.test(condN)) {
      // Detailseite sagt ungradet, Titel nennt aber einen Prüfdienst: im Zweifel ausschließen
    } else if (GRADED_COND_RX.test(condN)) { graded = true; gradedReason = "condition"; }
  } else if (row.condition === "New (Other)") {
    graded = true; gradedReason = "search-condition"; // ohne Detailseite nicht bestätigt: ausschließen
  }

  // Zustand
  let stage = null, stageSource = null;
  if (condRaw) {
    const s = stagesIn(condRaw);
    if (s.length === 1) { stage = s[0]; stageSource = "field"; }
  }
  const cc = spec(sp, K.cardCondition);
  if (cc) {
    const s2 = stagesIn(cc);
    if (s2.length === 1) {
      if (stage && stage !== s2[0]) conflicts.push("condition");
      if (!stage) { stage = s2[0]; stageSource = "field"; }
    }
  }
  if (!stage) {
    const st = stagesIn(title);
    if (st.length === 1) { stage = st[0]; stageSource = "title"; }
  }

  // Sprache
  const langField = langFromField(spec(sp, K.language));
  const langTitle = langFromTitle(title);
  let language = langField || langTitle || null;
  if (langField && langTitle && langField !== langTitle && langField !== "OTHER") { conflicts.push("language"); language = null; }

  // Edition
  const featureText = [spec(sp, K.features), spec(sp, K.edition), spec(sp, K.set)].join(" | ");
  const fT = norm(title), fF = norm(featureText);
  const first = FIRST_RX.test(fT) || FIRST_RX.test(fF);
  const unlimited = UNLIMITED_RX.test(fT) || UNLIMITED_RX.test(fF);
  let edition = null;
  if (first && unlimited) { conflicts.push("edition"); }
  else if (first) edition = "1st";
  else if (unlimited) edition = "unlimited";

  // Druckvariante
  let variant = null;
  if (/4th print|4\.? ?druck|vierte auflage|fourth print/.test(norm(title + " " + featureText))) variant = "4th_print";
  else if (/shadowless|schattenlos/.test(norm(title + " " + featureText))) variant = "shadowless";

  // Neuauflage mit gleicher Kartennummer (Celebrations Classic Collection, Legendary Collection, Base Set 2)
  const rp = norm(title + " " + featureText).match(/classic collection|celebrations|25th anniversary|legendary collection|base set 2|basis[- ]?set 2/);
  const reprint = rp ? rp[0] : null;

  // Ausführung
  const finishField = spec(sp, K.finish);
  let finish = finishField ? finishFromText(finishField, true) : null;
  if (!finish) finish = finishFromText(featureText);
  if (!finish) finish = finishFromText(title);

  const price = Number(row.priceValue ?? (detail && detail.priceValue));
  return {
    itemId: String(row.itemId),
    url: row.itemId ? `https://www.ebay.de/itm/${row.itemId}` : row.url || null,
    title,
    price,
    currency: row.currency || (detail && detail.currency) || "EUR",
    soldAt: row.soldAt ? new Date(row.soldAt).toISOString() : parseSoldAt(row, detail),
    format: row.buyingFormat || (detail && detail.buyingFormat) || null,
    priceUncertain: Boolean(row.priceIsAskingPrice || row.bestOfferAccepted),
    hasDetail: Boolean(detail),
    graded, gradedReason,
    multi: MULTI_TITLE_RX.test(norm(title)) || new Set([...norm(title).matchAll(/\b(\d{1,3})\s*\/\s*\d{2,3}\b/g)].map((m) => Number(m[1]))).size > 1,
    stage, stageSource, language, edition, variant, reprint, finish, conflicts,
    image: pickImage(row, detail),
  };
}

/* ========================================================================
   matchCard: passende Verkäufe für eine Karte finden und auswerten
   card = { name, number, setTotal?, language: 'DE'|'EN', condition: 'NM'|'LP'|'MP'|'HP',
            finish: 'non_holo'|'holo'|'reverse_holo', firstEdition: boolean, variants?: {normal,holo,reverse} }
   ======================================================================== */
function median(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// Kartennummer zerlegen: "108" -> {prefix:"", num:108}, "H03" -> {prefix:"h", num:3}, "TG05" -> {prefix:"tg", num:5}
function parseNumber(n) {
  const m = String(n ?? "").trim().match(/^([A-Za-z]{0,5})\s*0*(\d+)/);
  return m ? { prefix: m[1].toLowerCase(), num: Number(m[2]) } : { prefix: "", num: NaN };
}

const numberTokens = (title) => [...norm(title).matchAll(/\b([a-z]{0,5})0*(\d{1,3})\s*\/\s*([a-z]{0,5})0*(\d{1,3})\b/g)]
  .map((m) => ({ pre: m[1], num: Number(m[2]), den: Number(m[4]) }));
const ownNumberIn = (card, toks) => {
  const want = parseNumber(card.number);
  return toks.some((k) => k.pre === want.prefix && k.num === want.num &&
    (want.prefix || !card.setTotal || k.den === Number(card.setTotal)));
};

// Gehört der Verkauf zu genau dieser Karte? Nummern mit Buchstaben (H3/H32) sind eine andere Karte als 3/147.
function relevant(card, sale) {
  const t = norm(sale.title);
  const want = parseNumber(card.number);
  const toks = numberTokens(sale.title);
  if (toks.length) return ownNumberIn(card, toks);
  // ohne "x/y": Buchstaben-Nummern wie "H29" allein im Titel
  const lone = [...t.matchAll(/\b([a-z]{1,5})\s?0*(\d{1,3})\b/g)].filter((m) => m[1] === want.prefix || (!want.prefix && m[1] === "h"));
  if (want.prefix) {
    if (lone.some((m) => m[1] === want.prefix && Number(m[2]) === want.num)) return true;
    if (lone.length) return false;
  } else if (lone.length) {
    return false; // Titel nennt eine Holo-Nummer (H..), deine Karte hat keine
  }
  const words = norm(card.name).split(/[^a-z0-9]+/).filter((w) => w.length >= 4);
  return words.length > 0 && words.some((w) => t.includes(w));
}

function onlyFinish(card) {
  const v = card.variants;
  if (!v) return null;
  const f = [];
  if (v.normal) f.push("non_holo");
  if (v.holo) f.push("holo");
  if (v.reverse) f.push("reverse_holo");
  return f.length === 1 ? f[0] : null;
}

// Welche Ausführung zählt? Bei Reverse-Karten, die es unter dieser Nummer nicht als echte Holo gibt
// (z. B. Expedition 33-64), meint "Holo" im Titel oft die Reverse-Version. Das wird nur gewertet, wenn der Titel
// die eigene Kartennummer nennt: Ohne Nummer kann die echte Holo-Karte (andere Nummer, teurer) gemeint sein.
function effectiveFinish(card, sale) {
  if (sale.finish !== "holo" || card.finish !== "reverse_holo") return sale.finish || null;
  const v = card.variants;
  if (!v || v.holo !== false) return sale.finish;
  return ownNumberIn(card, numberTokens(sale.title)) ? "reverse_holo" : sale.finish;
}

function check(card, sale) {
  const r = {};
  // Sprache
  if (sale.language) r.language = sale.language === card.language ? "match" : "mismatch";
  else {
    const nameHit = norm(sale.title).includes(norm(card.name));
    r.language = card.language === "EN" || nameHit ? "assumed" : "unknown";
  }
  // Edition
  if (card.firstEdition) r.edition = sale.edition === "1st" ? "match" : sale.edition === "unlimited" ? "mismatch" : "unknown";
  else r.edition = sale.edition === "1st" ? "mismatch" : "match";
  // Ausführung. Reverse muss belegt sein (wie die 1st Edition): Ohne Angabe zählt ein Verkauf nicht,
  // denn wer eine Reverse Holo verkauft, schreibt das fast immer dazu. Bei normalen Karten gilt "ohne Angabe" als normal.
  const only = onlyFinish(card);
  const fin = effectiveFinish(card, sale);
  if (card.finish === "reverse_holo") r.finish = fin === "reverse_holo" ? "match" : fin ? "mismatch" : "unproven";
  else if (fin) r.finish = fin === card.finish ? "match" : "mismatch";
  else r.finish = only && only === card.finish ? "match" : "unknown";
  // Zustand
  r.condition = sale.stage ? (sale.stage === card.condition ? "match" : "mismatch") : "unknown";
  return r;
}

function windowStats(sales, now, days) {
  const from = now - days * DAY;
  const v = sales.filter((s) => new Date(s.soldAt).getTime() >= from).map((s) => s.price);
  return { days, n: v.length, median: median(v), min: v.length ? Math.min(...v) : null, max: v.length ? Math.max(...v) : null };
}

function matchCard(card, sales, opts = {}) {
  const now = opts.now ? new Date(opts.now).getTime() : Date.now();
  const ex = { graded: 0, multi: 0, variant: 0, conflict: 0, irrelevant: 0, old: 0, other_currency: 0, duplicate: 0, no_date: 0 };
  const seen = new Set();
  const cands = [], conflictList = [], rejected = [];
  const reject = (s, reason) => rejected.push({ sale: s, reason });

  for (const s of sales) {
    const key = `${s.itemId}|${(s.soldAt || "").slice(0, 10)}|${s.price}`;
    if (seen.has(key)) { ex.duplicate++; continue; }
    seen.add(key);
    if (!s.soldAt) { ex.no_date++; reject(s, "no_date"); continue; }
    if (now - new Date(s.soldAt).getTime() > 365 * DAY) { ex.old++; reject(s, "old"); continue; }
    if (s.currency !== "EUR") { ex.other_currency++; reject(s, "other_currency"); continue; }
    if (!relevant(card, s)) { ex.irrelevant++; reject(s, "irrelevant"); continue; }
    if (s.graded) { ex.graded++; reject(s, "graded"); continue; }
    if (s.multi) { ex.multi++; reject(s, "multi"); continue; }
    if (s.variant === "4th_print" || (s.variant === "shadowless" && !card.firstEdition)) { ex.variant++; reject(s, "variant"); continue; }
    if (s.reprint && !norm(card.setName || "").includes(s.reprint)) { ex.variant++; reject(s, "reprint"); continue; }
    if ((s.conflicts || []).length) { ex.conflict++; conflictList.push(s); reject(s, "conflict"); continue; }
    cands.push({ s, c: check(card, s) });
  }

  const mism = { language: 0, edition: 0, finish: 0, condition: 0, reverse_unproven: 0 };
  const strict = [], relaxed = [];
  for (const { s, c } of cands) {
    const vals = Object.values(c);
    if (c.language === "mismatch") mism.language++;
    else if (c.edition === "mismatch") mism.edition++;
    else if (c.finish === "mismatch") mism.finish++;
    else if (c.condition === "mismatch") mism.condition++;
    else if (c.finish === "unproven") mism.reverse_unproven++;
    const order = ["language", "edition", "finish", "condition"];
    if (vals.includes("mismatch")) { reject(s, order.find((k) => c[k] === "mismatch")); continue; }
    if (c.finish === "unproven") { reject(s, "reverse_unproven"); continue; }
    s.finishEff = effectiveFinish(card, s); // für die Anzeige: "Holo" mit eigener Nummer gilt als Reverse
    if (vals.every((v) => v === "match")) { strict.push(s); relaxed.push(s); continue; }
    // gelockert: Sprache und Ausführung dürfen angenommen sein, Edition (bei 1st) und Zustand nicht
    const okRelaxed = (c.language === "match" || c.language === "assumed") &&
      (c.finish === "match" || c.finish === "unknown") &&
      c.edition === "match" && c.condition === "match";
    if (okRelaxed) relaxed.push(s);
    else reject(s, "unknown_" + (order.find((k) => c[k] === "unknown") || "condition"));
  }

  // Kennzahl einer Menge: 90 Tage, wenn dort mindestens 3 Verkäufe liegen, sonst 12 Monate mit mindestens 3,
  // sonst das Fenster mit dem ersten vorhandenen Verkauf (der Wert wird dann angezeigt, zählt aber nicht im Gesamtwert).
  const evaluate = (set) => {
    const sorted = [...set].sort((x, y) => new Date(y.soldAt) - new Date(x.soldAt));
    const windows = { d30: windowStats(sorted, now, 30), d90: windowStats(sorted, now, 90), d365: windowStats(sorted, now, 365) };
    const pick = (w, label) => ({ value: w.median, basis: label, n: w.n });
    let headline = null;
    if (windows.d90.n >= 3) headline = pick(windows.d90, "90 Tage");
    else if (windows.d365.n >= 3) headline = pick(windows.d365, "12 Monate");
    else if (windows.d90.n >= 1) headline = pick(windows.d90, "90 Tage");
    else if (windows.d365.n >= 1) headline = pick(windows.d365, "12 Monate");
    const last5 = sorted.slice(0, 5).map((x) => x.price);
    return { sorted, windows, headline, last5: { n: last5.length, median: median(last5) } };
  };
  const evStrict = evaluate(strict), evRelaxed = evaluate(relaxed);
  let tier = "none", ev = evRelaxed, used = [];
  if (evStrict.headline && evStrict.headline.n >= 3) { tier = "strict"; ev = evStrict; used = evStrict.sorted; }
  else if (evRelaxed.headline) { tier = "relaxed"; ev = evRelaxed; used = evRelaxed.sorted; }
  const headline = tier === "none" ? null : ev.headline;
  const windows = ev.windows;
  const last5 = ev.last5;

  return {
    tier, used, strictN: strict.length, relaxedN: relaxed.length, candidates: cands.length,
    windows, last5, headline,
    countsTowardTotal: Boolean(headline && headline.n >= 3),
    uncertainN: used.filter((s) => s.priceUncertain).length,
    excluded: ex, mismatched: mism, conflicts: conflictList, rejected,
  };
}

// Suchbegriff für eBay: Name und Set, bewertete Karten und Sammelangebote werden schon bei eBay ausgeschlossen.
// Jede zurückgelieferte Zeile kostet Geld, deshalb lieber vorher aussortieren.
// Begriffe, die Verkäufer für die alten Sets tatsächlich in den Titel schreiben (deutsch und englisch).
// Schlüssel ist die TCGdex-Set-Kennung, sie ist in allen Sprachen gleich. Der TCGdex-Setname passt oft nicht
// zum Sprachgebrauch auf eBay (z. B. "Grundset" statt "Base Set", "Expedition Base Set" statt "Expedition").
// Mehrere Begriffe werden mit eBays Oder-Schreibweise verbunden: (A,B,C) = A oder B oder C im Titel.
const SET_TERMS = {
  base1: ["Base", "Basis", "Grundset", "Basisset"],
  base2: ["Jungle", "Dschungel"],
  base3: ["Fossil"],
  base5: ["Rocket"],
  neo1: ["Genesis"],
  neo2: ["Discovery"],
  neo3: ["Revelation"],
  neo4: ["Destiny"],
  lc: ["Legendary"],
  ecard1: ["Expedition"],
  ecard2: ["Aquapolis"],
  ecard3: ["Skyridge"],
};

function setIdOf(c) {
  return (c.tcg_meta && c.tcg_meta.setId) || (c.tcgdex_id ? String(c.tcgdex_id).replace(/-[^-]+$/, "") : null);
}

function buildQuery(card) {
  const terms = card.setId && SET_TERMS[card.setId];
  const setPart = terms ? (terms.length === 1 ? terms[0] : `(${terms.join(",")})`) : card.setName;
  // Reverse-Karten: gezielt nach "reverse" suchen, sonst sind die meisten bezahlten Zeilen normale Karten
  const base = [card.name, setPart, card.finish === "reverse_holo" ? "reverse" : ""].filter(Boolean).join(" ");
  return base + " -PSA -BGS -CGC -GSG -SGC -Beckett -graded -bewertet -slab -lot -bundle";
}

// Vergleichsschlüssel für Suchbegriffe: Groß-/Kleinschreibung, Klammern, Kommas und Reihenfolge spielen keine Rolle.
// So werden Ergebnisse auch dann der richtigen Karte zugeordnet, wenn eBay den Suchbegriff leicht umformatiert zurückgibt.
const queryKey = (q) => String(q || "").toLowerCase().replace(/[(),]/g, " ").split(/\s+/)
  .filter((t) => t && !t.startsWith("-")).sort().join(" ");

/* ========================================================================
   Funktionen für den Nachtjob und die App
   ======================================================================== */

// Datenbankzeile einer Karte -> Karte für die Erkennung
function cardFromRow(c) {
  const meta = c.tcg_meta || {};
  return {
    name: c.name,
    number: c.card_number,
    setTotal: c.set_total || null,
    setName: c.set_name || "",
    language: c.language,
    condition: c.condition,
    finish: c.finish || (c.foil ? "holo" : "non_holo"),
    firstEdition: Boolean(c.first_edition),
    variants: meta.variants || null,
  };
}

// Suchzeile + Detailseite -> Zeile für die Tabelle ebay_sales
function toDbRow(cardId, sale, row) {
  const { itemId, title, url, price, soldAt, ...facts } = sale;
  return {
    card_id: cardId,
    item_id: itemId,
    sold_at: soldAt,
    price_eur: price,
    title,
    url: url || null,
    parsed: { ...facts, raw: { condition: row.condition ?? null, buyingFormat: row.buyingFormat ?? null, priceIsAskingPrice: Boolean(row.priceIsAskingPrice), bestOfferAccepted: Boolean(row.bestOfferAccepted) } },
  };
}

// Tabellenzeile -> Verkauf für matchCard
function saleFromDb(r) {
  const { raw, ...facts } = r.parsed || {};
  if (!facts.finish) facts.finish = finishFromText(r.title || "");
  return { ...facts, itemId: r.item_id, title: r.title, url: r.url, price: Number(r.price_eur), soldAt: new Date(r.sold_at).toISOString(), currency: "EUR" };
}

// Suchzeile einer gespeicherten Zeile rekonstruieren (für nachträgliche Detailseiten)
function rowFromDb(r) {
  const raw = (r.parsed && r.parsed.raw) || {};
  return { itemId: r.item_id, title: r.title, url: r.url, priceValue: Number(r.price_eur), currency: "EUR", soldAt: r.sold_at, condition: raw.condition, buyingFormat: raw.buyingFormat, priceIsAskingPrice: raw.priceIsAskingPrice, bestOfferAccepted: raw.bestOfferAccepted, image: (r.parsed && r.parsed.image) || null };
}

// Vorauswahl: lohnt sich eine Detailseite (kostet Geld)?  "drop" = nicht zur Karte, "ok" = reicht, "detail" = Detailseite holen
function triage(card, sale) {
  if (!sale.soldAt || sale.currency !== "EUR") return "drop";
  if (!relevant(card, sale)) return "drop";
  if (sale.multi) return "drop";
  if (sale.graded && sale.gradedReason !== "search-condition") return "drop";
  if (sale.variant === "4th_print" || (sale.variant === "shadowless" && !card.firstEdition)) return "drop";
  if (sale.reprint && !norm(card.setName || "").includes(sale.reprint)) return "drop";
  if (sale.conflicts.length) return "drop";
  const c = check(card, sale);
  if (c.language === "mismatch" || c.edition === "mismatch" || c.finish === "mismatch") return "drop";
  if (c.condition === "mismatch" && sale.stageSource === "title") return "drop";
  if (sale.hasDetail) return "ok";
  const open = c.language !== "match" || c.condition !== "match" || c.finish === "unknown" || c.finish === "unproven" ||
    (card.firstEdition && c.edition !== "match") || sale.gradedReason === "search-condition";
  return open ? "detail" : "ok";
}

// Ergebnis -> Zeile für price_snapshots (Quelle ebay_sold)
function snapshotPayload(r) {
  if (!r.headline) return null;
  const w = (x) => ({ n: x.n, median: x.median == null ? null : Math.round(x.median * 100) / 100 });
  return {
    price: Math.round(r.headline.value * 100) / 100,
    details: {
      n: r.headline.n, basis: r.headline.basis, tier: r.tier, counts: r.countsTowardTotal,
      strictN: r.strictN, relaxedN: r.relaxedN, uncertainN: r.uncertainN, conflicts: r.conflicts.length,
      windows: { d30: w(r.windows.d30), d90: w(r.windows.d90), d365: w(r.windows.d365) },
      last5: w(r.last5), excluded: r.excluded,
    },
  };
}

const saleKey = (s) => `${s.itemId}|${String(s.soldAt || "").slice(0, 10)}|${s.price}`;

return { parseSale, matchCard, buildQuery, cardFromRow, saleFromDb, snapshotPayload, stagesIn, saleKey, STAGES, setIdOf, queryKey };
})();

// Zweite Bildquelle für Karten, zu denen TCGdex kein Bild hat (häufig bei älteren Holos, z. B. Aquapolis H3).
// TCGdex-Kennung "ecard2-H03" -> https://images.pokemontcg.io/ecard2/H3.png
const altImageUrl = id => {
  const m = String(id || "").match(/^(.+)-([^-]+)$/);
  if (!m) return null;
  const n = m[2].match(/^([A-Za-z]*)0*(\d+)$/); // "H03" -> "H3", "003" -> "3": der Bilddienst nutzt keine führenden Nullen
  const num = n ? n[1].toUpperCase() + n[2] : m[2];
  return `https://images.pokemontcg.io/${encodeURIComponent(m[1])}/${encodeURIComponent(num)}.png`;
};
const probeImage = (url, ms = 6000) => new Promise(resolve => {
  const i = new Image();
  const t = setTimeout(() => { i.src = ""; resolve(false); }, ms);
  i.onload = () => { clearTimeout(t); resolve(true); };
  i.onerror = () => { clearTimeout(t); resolve(false); };
  i.src = url;
});

window.imgFallback = img => {
  if (!img.dataset.fb && img.src.includes("/de/")) {
    img.dataset.fb = "1";
    img.src = img.src.replace("/de/", "/en/");
    return;
  }
  const alt = altImageUrl(img.dataset.tid);
  if (alt && !img.dataset.fb2 && img.src !== alt) {
    img.dataset.fb2 = "1";
    img.src = alt;
    return;
  }
  img.style.visibility = "hidden";
};

async function tcg(path) {
  const res = await fetch(`${TCGDEX}/${path}`);
  if (!res.ok) throw new Error(`TCGdex antwortet mit Status ${res.status}`);
  return res.json();
}

async function imageFor(id, lang, own) {
  if (own) return `${own}/low.webp`;
  if (lang !== "EN") {
    try {
      const en = await tcg(`en/cards/${encodeURIComponent(id)}`);
      if (en.image) return `${en.image}/low.webp`;
    } catch (e) { /* weiter mit der zweiten Quelle */ }
  }
  const alt = altImageUrl(id);
  if (alt && await probeImage(alt)) return alt;
  return null;
}

async function repairImages() {
  const todo = state.cards.filter(c => !c.image_url && c.tcgdex_id && !triedImages.has(c.id));
  let changed = false;
  for (const c of todo) {
    triedImages.add(c.id);
    const url = await imageFor(c.tcgdex_id, c.language, null);
    if (!url) continue;
    const { error } = await db.from("cards").update({ image_url: url }).eq("id", c.id);
    if (!error) { c.image_url = url; changed = true; }
  }
  if (changed) renderMain();
}

// Aktuellen Wert neu speichern, wenn du Angaben oder Ausschlüsse änderst
async function writeSnapshot(card, result, hadValue) {
  const snap = EBAY.snapshotPayload(result);
  let row = null;
  if (snap) row = { card_id: card.id, captured_on: today(), source: "ebay_sold", price_eur: snap.price, details: snap.details };
  else if (hadValue) row = { card_id: card.id, captured_on: today(), source: "ebay_sold", price_eur: 0, details: { none: true, n: 0, counts: false } };
  if (!row) return true;
  const { error } = await db.from("price_snapshots").upsert(row, { onConflict: "card_id,captured_on,source" });
  return !error;
}

  const [c, l, d, js] = await Promise.all([
    db.from("cards").select("*").order("created_at", { ascending: false }),

  }
  // Ohne update2.sql gibt es die Ansicht nicht: Kurve dann ausblenden, Rest läuft normal.
  state.daily = d.error ? null : (d.data || []);

const JOB_URL = "https://github.com/mosc0001/karten-tracker/actions/workflows/ebay.yml";
const usd = v => Number(v || 0).toLocaleString("de-DE", { style: "currency", currency: "USD" });
function whenText(iso) {
  const d = new Date(iso), now = new Date();
  const t = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  return diff === 0 ? `heute ${t}` : diff === 1 ? `gestern ${t}` : `am ${d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })} ${t}`;
}
// Liefert Hinweise (oben) und eine Statuszeile (im Kopfbereich) zum Nachtjob
function jobStatus() {
  const j = state.job;
  if (needsUpdate5()) return { banners: "", line: "" };
  if (j && j.missing) return { banners: `<p class="banner" role="note">Bitte update6.sql in Supabase ausführen, damit die App den Status des Nachtjobs anzeigt.</p>`, line: "" };
  if (!j || !j.at) return { banners: "", line: `<p class="sub jobline">Nachtjob: Der Status erscheint nach dem nächsten Lauf.</p>` };
  const link = txt => `<a href="${JOB_URL}" target="_blank" rel="noopener">${txt}</a>`;
  const notes = [];
  const hours = (Date.now() - new Date(j.at).getTime()) / 3600000;
  if (hours > 50) notes.push(["bad", `Der Nachtjob ist seit ${Math.floor(hours / 24)} Tagen nicht gelaufen, die Preise werden nicht mehr aktualisiert. ${link("In GitHub prüfen")}`]);
  if (j.ok === false) notes.push(["bad", `Der letzte Lauf des Nachtjobs ist fehlgeschlagen: ${esc(j.message || "unbekannter Fehler")} ${link("Protokoll ansehen")}`]);
  else if (j.partial) notes.push(["", `Beim letzten Lauf ist ein Teil der eBay-Abfragen fehlgeschlagen (${esc(j.message || "")}). Die betroffenen Karten kommen beim nächsten Lauf erneut dran.`]);
  if (j.tokenMissing) notes.push(["bad", `Dem Nachtjob fehlt der Apify-Schlüssel (GitHub-Secret APIFY_TOKEN). Er rechnet nur noch mit den vorhandenen Verkäufen.`]);
  const now = new Date();
  const thisMonth = now.toISOString().slice(0, 7);
  const sameMonth = j.month === thisMonth;
  const spent = sameMonth ? Number(j.monthSpent || 0) : 0;
  const budget = Number(j.monthBudget || 0);
  const budgetOut = sameMonth && j.waiting > 0 && budget - spent < 0.35;
  if (budgetOut) {
    const next = new Date(now.getFullYear(), now.getMonth() + 1, 1).toLocaleDateString("de-DE", { month: "long" });
    notes.push(["", `Monatsbudget erreicht (${usd(spent)} von ${usd(budget)}): ${j.waiting} fällige ${j.waiting === 1 ? "Karte wartet" : "Karten warten"} bis zum 1. ${next}. Mehr Budget: EBAY_MONTH_BUDGET_USD in ebay.yml.`]);
  }
  const open = state.cards.filter(c => !c.ebay_checked_at).length;
  const parts = [`Nachtjob: zuletzt ${whenText(j.at)}${j.ok === false ? " (fehlgeschlagen)" : ""}`,
    `${now.toLocaleDateString("de-DE", { month: "long" })}: ${usd(spent)} von ${usd(budget)} (geschätzt)`];
  if (open) parts.push(`${open} ${open === 1 ? "Karte" : "Karten"} noch ohne eBay-Abfrage`);
  return {
    banners: notes.map(([cls, txt]) => `<p class="banner${cls ? " " + cls : ""}" role="${cls ? "alert" : "note"}">${txt}</p>`).join(""),
    line: `<p class="sub jobline">${parts.join(" · ")}</p>`
  };
}

const SORTS = [["value", "Sortieren: Wert"], ["name", "Sortieren: Name"], ["newest", "Sortieren: Neueste"]];
const norm = v => String(v ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function setIdOf(c) {
  const id = c.tcgdex_id;
  if (!id) return null;
  const suffix = c.card_number ? "-" + c.card_number : null;
  if (suffix && id.endsWith(suffix)) return id.slice(0, -suffix.length);
  const i = id.lastIndexOf("-");
  return i > 0 ? id.slice(0, i) : null;
}

function setYear(setName) {
  for (const c of state.cards) {
    if (c.set_name !== setName) continue;
    const y = state.setYears[setIdOf(c)];
    if (y) return y;
  }
  return "";
}

const setLabel = name => { const y = setYear(name); return y ? `${name} (${y})` : name; };

function setNames() {
  return [...new Set(state.cards.map(c => c.set_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
}

async function loadSetYears() {
  const todo = new Map();
  for (const c of state.cards) {
    const id = setIdOf(c);
    if (id && !(id in state.setYears) && !todo.has(id)) todo.set(id, c.language.toLowerCase());
  }
  if (!todo.size) return;
  let changed = false;
  for (const [id, lang] of todo) {
    let date = null, reached = false;
    for (const l of lang === "en" ? ["en"] : [lang, "en"]) {
      try {
        const set = await tcg(`${l}/sets/${encodeURIComponent(id)}`);
        reached = true;
        if (set && set.releaseDate) { date = set.releaseDate; break; }
      } catch (e) { /* nächste Sprache versuchen */ }
    }
    if (date) { state.setYears[id] = date.slice(0, 4); changed = true; }
    else if (reached) { state.setYears[id] = ""; changed = true; }
  }
  if (!changed) return;
  try { localStorage.setItem(YEAR_KEY, JSON.stringify(state.setYears)); } catch (e) { /* Speicher nicht verfügbar */ }
  updateSetOptions();
  if (state.filter.q.trim()) renderList();
}

function updateSetOptions() {
  const sel = $("#fset");
  if (!sel) return;
  const f = state.filter;
  sel.innerHTML = `<option value="">Alle Sets</option>` +
    setNames().map(v => `<option value="${esc(v)}"${v === f.set ? " selected" : ""}>${esc(setLabel(v))}</option>`).join("");
}

function suggestions(q) {
  const nq = norm(q).trim();
  const tokens = nq.split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  const match = label => { const h = norm(label); return tokens.every(t => h.includes(t)); };
  const score = label => (norm(label).startsWith(nq) ? 0 : 1);
  const count = (key, val) => state.cards.filter(c => c[key] === val).reduce((s, c) => s + c.quantity, 0);
  const bySc = (a, b) => score(a.label) - score(b.label) || a.label.localeCompare(b.label, "de");
  const sets = setNames().filter(n => match(setLabel(n)))
    .map(n => ({ type: "set", value: n, label: setLabel(n), n: count("set_name", n) })).sort(bySc).slice(0, 4);
  const names = [...new Set(state.cards.map(c => c.name))].filter(match)
    .map(n => ({ type: "name", value: n, label: n, n: count("name", n) })).sort(bySc).slice(0, 6);
  return [...sets, ...names];
}

function wireSuggestions(input) {
  const list = $("#fsug");
  const f = state.filter;
  let items = [], active = -1;
  const hide = () => {
    list.hidden = true;
    input.setAttribute("aria-expanded", "false");
    input.removeAttribute("aria-activedescendant");
    active = -1;
  };
  const paint = () => {
    list.querySelectorAll("li").forEach((li, i) => li.classList.toggle("active", i === active));
    if (active >= 0) input.setAttribute("aria-activedescendant", `sug-${active}`);
    else input.removeAttribute("aria-activedescendant");
  };
  const show = () => {
    items = suggestions(input.value);
    active = -1;
    if (!items.length) return hide();
    list.innerHTML = items.map((s, i) => `<li id="sug-${i}" role="option" data-i="${i}">
      <span class="sugtype">${s.type === "set" ? "Set" : "Karte"}</span>
      <span class="suglabel">${esc(s.label)}</span>
      <span class="sugcount">${s.n} ${s.n === 1 ? "Karte" : "Karten"}</span></li>`).join("");
    list.hidden = false;
    input.setAttribute("aria-expanded", "true");
  };
  const choose = s => {
    if (s.type === "set") {
      f.set = s.value;
      f.q = "";
      input.value = "";
      const sel = $("#fset");
      if (sel) sel.value = s.value;
    } else {
      f.q = s.value;
      input.value = s.value;
    }
    hide();
    renderList();
  };
  input.addEventListener("input", () => { f.q = input.value; renderList(); show(); });
  input.addEventListener("focus", show);
  input.addEventListener("blur", () => setTimeout(hide, 150));
  input.addEventListener("keydown", e => {
    if (list.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); active = (active + 1) % items.length; paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = active <= 0 ? items.length - 1 : active - 1; paint(); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); choose(items[active]); }
    else if (e.key === "Escape") { hide(); }
  });
  list.addEventListener("mousedown", e => e.preventDefault());
  list.addEventListener("click", e => {
    const li = e.target.closest("li[data-i]");
    if (li) choose(items[Number(li.dataset.i)]);
  });
}

function gainOf(rows) {
  let gain = 0, cost = 0, n = 0;
  for (const { c, unit, counted } of rows) {
    if (c.purchase_price_eur == null || unit == null || !counted) continue;
    const pp = Number(c.purchase_price_eur);
    gain += (unit - pp) * c.quantity;
    cost += pp * c.quantity;
    n++;
  }
  return n ? { gain, n, pct: cost > 0 ? gain / cost * 100 : null } : null;
}

function fmtRange(a, b) {
  const sameYear = a.slice(0, 4) === b.slice(0, 4);
  const short = d => new Date(d + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  return sameYear ? `${short(a)} bis ${fmtDate(b)}` : `${fmtDate(a)} bis ${fmtDate(b)}`;
}

function lineChart(points, getV, aria) {
  const W = 320, H = 110, pad = 6;
  const ys = points.map(getV);
  const min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
  const x = i => pad + (i / (points.length - 1)) * (W - 2 * pad);
  const y = v => H - pad - ((v - min) / span) * (H - 2 * pad);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(getV(p)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(aria)}"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="range"><span>${eur(min)}</span><span>${fmtRange(points[0].captured_on, points[points.length - 1].captured_on)}</span><span>${eur(max)}</span></div>`;
}

function filterActive(f) {

function renderList() {
  const wrap = $("#listwrap");
  if (!wrap) return;
  if (!state.cards.length) {
    wrap.innerHTML = `<p class="empty">Noch keine Karten. Tippe auf „Karte hinzufügen“ und suche nach dem Namen.</p>`;
    return;
  }
  const f = state.filter;
  const tokens = norm(f.q).split(/\s+/).filter(Boolean);
  const years = new Map(setNames().map(n => [n, setYear(n)]));
  const rows = cardRows().filter(({ c, counted }) => {
    if (f.lang && c.language !== f.lang) return false;
    if (f.set && c.set_name !== f.set) return false;
    if (f.missing && counted) return false;
    if (tokens.length) {
      const hay = norm(`${c.name} ${c.set_name || ""} ${c.card_number || ""} ${years.get(c.set_name) || ""} ${c.first_edition ? "1st edition first edition" : ""} ${finishOf(c) === "holo" ? "holo" : finishOf(c) === "reverse_holo" ? "reverse holo" : "non-holo"}`);
      if (!tokens.every(t => hay.includes(t))) return false;
    }
    return true;
  });
  const sorters = {
    value: (a, b) => (b.total ?? -1) - (a.total ?? -1),
    name: (a, b) => a.c.name.localeCompare(b.c.name, "de"),
    newest: (a, b) => String(b.c.created_at).localeCompare(String(a.c.created_at))
  };
  rows.sort(sorters[f.sort] || sorters.value);

  const info = $("#resinfo");
  if (info) {
    if (filterActive(f)) {
      const n = rows.reduce((s, r) => s + r.c.quantity, 0);
      const v = rows.reduce((s, r) => s + (r.counted ? r.total : 0), 0);
      info.innerHTML = `<span>${n} ${n === 1 ? "Karte" : "Karten"} gefunden, Wert ${eur(v)}</span><button class="linkish" id="freset">Filter zurücksetzen</button>`;
      $("#freset").onclick = resetFilters;
    } else {
      info.innerHTML = "";
    }
  }
  wrap.innerHTML = !rows.length
    ? `<p class="empty">Keine Karte passt zu deiner Suche.</p>`
    : state.view === "grid"
      ? `<ul class="grid">${rows.map(tileHtml).join("")}</ul>`
      : `<ul class="list">${rows.map(rowHtml).join("")}</ul>`;
}

const setsCache = {};
function setsFor(lang) {
  if (!setsCache[lang]) setsCache[lang] = tcg(`${lang}/sets`).catch(e => { delete setsCache[lang]; throw e; });
  return setsCache[lang];
}

function setIdFromCardId(id, localId) {
  const suffix = localId != null ? "-" + localId : null;
  if (suffix && id.endsWith(suffix)) return id.slice(0, -suffix.length);
  const i = id.lastIndexOf("-");
  return i > 0 ? id.slice(0, i) : id;
}

/* ---------- Kamera-Scan: erkennen und bestätigen ---------- */
// Foto verkleinern: spart Übertragung und Kosten. Die Claude-Schnittstelle verkleinert größere Bilder ohnehin.
function loadImg(src) {
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => bad(new Error("Das Foto konnte nicht gelesen werden.")); im.src = src; });
}
async function photoToJpeg(file, maxEdge = 1400) {
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);
    const sc = Math.min(1, maxEdge / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(im, 0, 0, w, h);
    const dataUrl = cv.toDataURL("image/jpeg", 0.9);
    return { dataUrl, base64: dataUrl.split(",")[1], w, h };
  } finally { URL.revokeObjectURL(url); }
}
// Erkennung über die Supabase-Funktion scan-card (dort liegt der Schlüssel für die Claude-Schnittstelle)
async function recognizeCard(base64) {
  try {
    const { data, error } = await db.functions.invoke("scan-card", { body: { image: base64, mediaType: "image/jpeg" } });
    if (error) {
      let msg = error.message || "Erkennung fehlgeschlagen.";
      const status = error.context && error.context.status;
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) { /* keine JSON-Antwort */ }
      if (status === 404 || /not found|failed to send/i.test(msg)) msg = "Der Scanner ist noch nicht eingerichtet: Die Supabase-Funktion scan-card fehlt oder ist nicht erreichbar.";
      return { error: msg };
    }
    return { card: data && data.card };
  } catch (e) {
    return { error: "Erkennung fehlgeschlagen: " + e.message };
  }
}
const numKey = x => String(x ?? "").trim().toUpperCase().replace(/^([A-Z]*)0*(\d)/, "$1$2");

function openAdd() {
  const s = { lang: "DE", picked: null, results: [] };
  const sheet = openSheet(`
    <header class="sheet-head"><h2>Karte hinzufügen</h2><button class="ghost" data-close>Fertig</button></header>
    <div class="scanrow">

    </div>

    <div class="searchrow">

    res.innerHTML = `${msg ? `<p class="okmsg" role="status">${esc(msg)}</p>` : ""}${list.length ? `<ul class="results">${list.map(c => {
      const sid = setIdFromCardId(c.id, c.localId);

        ${c.image ? `<img src="${esc(c.image)}/low.webp" alt="" loading="lazy" data-tid="${esc(c.id || "")}" onerror="imgFallback(this)">` : `<span class="noimg"></span>`}

    }).join("")}</ul>` : ""}`;
    res.querySelectorAll(".pick").forEach(b => b.onclick = () => pick(b.dataset.id));

  async function search() {
    const raw = $("#q", sheet).value.trim();
    const num = raw.match(/(\d+)\s*\/\s*(\d+)/);
    if (num) return searchByNumber(num[1], Number(num[2]), raw.replace(num[0], "").trim());
    if (raw.length < 2) return;
    res.innerHTML = `<p class="muted">Suche läuft …</p>`;
    try {
      const [list, sets] = await Promise.all([
        tcg(`${lang()}/cards?name=${encodeURIComponent(raw)}&pagination:page=1&pagination:itemsPerPage=40`),
        setsFor(lang()).catch(() => [])
      ]);
      if (!list.length) {
        res.innerHTML = `<p class="muted">Keine Treffer. Probiere einen kürzeren Namen, die Kartennummer (z. B. 6/105) oder die andere Sprache.</p>`;
        return;
      }
      const byId = new Map(sets.map(x => [x.id, x.name]));
      showResults(list.map(c => ({ ...c, setName: byId.get(setIdFromCardId(c.id, c.localId)) })));
    } catch (e) {
      res.innerHTML = `<p class="err">Suche fehlgeschlagen: ${esc(e.message)}</p>`;
    }
  }

  // Alle Karten mit dieser Nummer in Sets mit dieser offiziellen Kartenzahl (null = kein solches Set)
  async function findByNumber(localNum, official) {
    const sets = await setsFor(lang());
    const cands = sets.filter(x => x.cardCount && Number(x.cardCount.official) === official).slice(0, 12);
    if (!cands.length) return null;
    const variants = [...new Set([localNum, localNum.replace(/^0+(?=\d)/, ""), localNum.padStart(3, "0")])];
    const found = [];
    for (const set of cands) {
      for (const v of variants) {
        try {
          const card = await tcg(`${lang()}/cards/${encodeURIComponent(`${set.id}-${v}`)}`);
          if (card && card.id) { found.push({ id: card.id, name: card.name, image: card.image, localId: card.localId, setName: set.name }); break; }
        } catch (e) { /* diese Schreibweise gibt es nicht, nächste probieren */ }
      }
    }
    return found;
  }

  // "6/105": Karte Nr. 6 aus einem Set mit 105 offiziellen Karten
  async function searchByNumber(localNum, official, nameFilter) {
    res.innerHTML = `<p class="muted">Suche nach Nr. ${esc(localNum)}/${official} …</p>`;
    try {
      const found = await findByNumber(localNum, official);
      if (!found) {
        res.innerHTML = `<p class="muted">Kein Set mit ${official} Karten gefunden. Prüfe die Nummer oder die Sprache.</p>`;
        return;
      }
      const nf = norm(nameFilter);
      const list = nf ? found.filter(c => norm(c.name).includes(nf)) : found;
      if (!list.length) {
        res.innerHTML = `<p class="muted">Keine Karte Nr. ${esc(localNum)}/${official} gefunden.</p>`;
        return;
      }
      showResults(list);
    } catch (e) {
      res.innerHTML = `<p class="err">Suche fehlgeschlagen: ${esc(e.message)}</p>`;
    }
  }

  // Erkannte Karte bei TCGdex finden: erst über Nummer und Setgröße, sonst über den Namen
  async function findScanned(card) {
    const num = String(card.number || "").trim(), tot = String(card.total || "").trim();
    const nameN = norm(card.name);
    const sameName = c => { const n = norm(c.name); return Boolean(nameN && n && (n.includes(nameN) || nameN.includes(n))); };
    let byNum = [];
    if (num && /^\d+$/.test(tot)) byNum = (await findByNumber(num, Number(tot)).catch(() => null)) || [];
    const both = byNum.filter(sameName);
    if (both.length) return both;
    if (!card.name) return byNum;
    // Nummern mit Buchstaben (z. B. H3/H32) oder kein Treffer: über den Namen suchen und nach Nummer filtern
    const [list, sets] = await Promise.all([
      tcg(`${lang()}/cards?name=${encodeURIComponent(card.name)}&pagination:page=1&pagination:itemsPerPage=60`).catch(() => []),
      setsFor(lang()).catch(() => [])
    ]);
    const setName = new Map(sets.map(x => [x.id, x.name]));
    const withNum = num ? list.filter(c => numKey(c.localId) === numKey(num)) : [];
    const out = (withNum.length ? withNum : list).map(c => ({ ...c, setName: setName.get(setIdFromCardId(c.id, c.localId)) }));
    return withNum.length ? out : (byNum.length ? byNum : out.slice(0, 20));
  }

  const scanPrev = (photo, inner) => `<div class="scanprev"><img src="${esc(photo)}" alt="Dein Foto"><div>${inner}</div></div>`;

  $("#scanbtn", sheet).onclick = () => $("#scanfile", sheet).click();
  $("#scanfile", sheet).onchange = async ev => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    s.scan = null; s.picked = null; s.results = [];
    res.innerHTML = `<p class="muted">Foto wird vorbereitet …</p>`;
    let photo;
    try { photo = await photoToJpeg(file); } catch (e) { res.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    res.innerHTML = scanPrev(photo.dataUrl, `<p class="muted" role="status">Karte wird erkannt …</p>`);
    const { card, error } = await recognizeCard(photo.base64);
    if (error) {
      res.innerHTML = scanPrev(photo.dataUrl, `<p class="err">${esc(error)}</p><p class="muted dsmall">Du kannst die Karte trotzdem oben über die Suche hinzufügen.</p>`);
      return;
    }
    if (!card || card.is_card === false || !card.name) {
      res.innerHTML = scanPrev(photo.dataUrl, `<p class="err">Auf dem Foto wurde keine Karte erkannt.</p><p class="muted dsmall">Versuche es mit einem geraderen, helleren Foto ohne Spiegelung, oder nutze die Suche.</p>`);
      return;
    }
    s.scan = { card, photo: photo.dataUrl };
    if (card.language === "DE" || card.language === "EN") {
      s.lang = card.language;
      sheet.querySelectorAll("#langseg button").forEach(x => x.classList.toggle("on", x.dataset.l === s.lang));
    }
    const numText = card.number ? ` Nr. ${card.number}${card.total ? "/" + card.total : ""}` : "";
    $("#q", sheet).value = `${card.name}${card.number && card.total && /^\d+$/.test(String(card.total)) ? ` ${card.number}/${card.total}` : ""}`;
    res.innerHTML = scanPrev(photo.dataUrl, `<p><b>${esc(card.name)}</b>${esc(numText)}</p><p class="muted" role="status">Karte wird gesucht …</p>`);
    const list = await findScanned(card);
    const other = card.language && !["DE", "EN"].includes(card.language)
      ? ` Erkannte Sprache: ${card.language}. Die App unterstützt Deutsch und Englisch, bitte Sprache prüfen.` : "";
    if (list.length === 1 && !other) return pick(list[0].id);
    if (list.length) return showResults(list, `Erkannt: ${card.name}${numText}. ${list.length === 1 ? "Bitte bestätigen." : "Mehrere Karten passen, bitte die richtige wählen."}${other}`);
    res.innerHTML = scanPrev(photo.dataUrl, `<p><b>${esc(card.name)}</b>${esc(numText)}</p><p class="muted">Die Karte wurde erkannt, aber bei TCGdex nicht gefunden. Prüfe die Sprache oben und suche über das Suchfeld.${esc(other)}</p>`);
  };

  // Hinweise zum Scan-Ergebnis im Formular: was übernommen wurde und was du prüfen solltest
  function scanHintHtml(card, tc, v, finishSet, firstSet) {
    const items = [];
    const sameNum = !card.number || numKey(card.number) === numKey(tc.localId);
    items.push(sameNum
      ? `Erkannt: ${esc(card.name)}${card.number ? `, Nr. ${esc(card.number)}${card.total ? "/" + esc(card.total) : ""}` : ""}, ${esc(card.language || "Sprache offen")}.`
      : `<span class="warn">Nummer weicht ab:</span> Foto ${esc(card.number)}, gewählte Karte ${esc(tc.localId)}. Bitte prüfen.`);
    if (card.first_edition === true && firstSet) items.push("1st Edition: Stempel erkannt, angehakt.");
    else if (card.first_edition === true) items.push(`<span class="warn">1st Edition erkannt,</span> laut TCGdex gibt es aber keinen 1st-Edition-Druck. Bitte prüfen.`);
    else if (card.first_edition === false) items.push("1st Edition: kein Stempel erkannt.");
    else if (v.firstEdition) items.push(`<span class="warn">1st Edition: nicht sicher erkennbar.</span> Bitte selbst prüfen.`);
    if (finishSet) items.push(`Ausführung: ${esc(FIN_LABEL[finishSet] || finishSet)} erkannt, vorausgewählt.`);
    else items.push(`<span class="warn">Ausführung: nicht sicher erkennbar.</span> Bitte prüfen.`);
    if (v.normal && v.reverse && finishSet !== "reverse_holo") items.push("Diese Karte gibt es auch als Reverse Holo. Der Schimmer ist auf Fotos schwer zu sehen, bitte prüfen.");
    items.push(`<span class="warn">Zustand bitte selbst wählen,</span> ein Foto reicht dafür nicht.`);
    if (card.notes) items.push(`Hinweis der Erkennung: ${esc(card.notes)}`);
    return `<div class="scanhint" role="note"><b>Scan-Ergebnis</b><ul>${items.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
  }

  async function pick(id) {
    res.innerHTML = `<p class="muted">Karte wird geladen …</p>`;
    try {
      const c = await tcg(`${lang()}/cards/${encodeURIComponent(id)}`);
      s.picked = c;
      s.imageUrl = await imageFor(c.id, s.lang, c.image);
      const v = c.variants || {};
      const defFinish = !v.normal && v.holo ? "holo" : (!v.normal && !v.holo && v.reverse ? "reverse_holo" : "non_holo");
      const sid = c.set && c.set.id;
      const year = sid && state.setYears[sid] ? ` (${state.setYears[sid]})` : "";
      res.innerHTML = `
        ${s.results.length ? `<button class="linkish" id="back">Zurück zu den Treffern</button>` : ""}
        <div class="preview">
          ${s.imageUrl ? `<img src="${esc(s.imageUrl)}" alt="" data-tid="${esc((s.picked && s.picked.id) || "")}" onerror="imgFallback(this)">` : ""}
          ${s.scan ? `<img class="scanmini" src="${esc(s.scan.photo)}" alt="Dein Foto">` : ""}
          <div>
            <h3>${esc(c.name)}</h3>
            <p class="muted">${esc(c.set && c.set.name || "")}${year}, Nr. ${esc(c.localId)}</p>
            <p class="muted">${esc(c.rarity || "")}</p>
            <p class="muted dsmall">Den Wert liefert die nächste eBay-Abfrage (täglich früh).</p>
          </div>
        </div>
        <div id="scanhint"></div>
        <label>Zustand<select id="cond">${condOptions("NM")}</select></label>
        <label>Menge<input id="qty" type="number" min="1" value="1" inputmode="numeric"></label>
        <label>Ausführung<select id="finish">${finishOptions(defFinish)}</select></label>
        <p class="muted dsmall">Holo: Das Kartenbild glänzt. Reverse Holo: Die Karte glänzt außerhalb des Bildes, das Bild selbst nicht.</p>
        <label class="check"><input id="first" type="checkbox"> <span>1st Edition${v.firstEdition ? " (für diese Karte ist ein 1st-Edition-Druck bekannt)" : ""}<br><small class="muted">Beim eBay-Abgleich zählen dann nur 1st-Edition-Verkäufe.</small></span></label>
        <label>Kaufpreis pro Karte in EUR (optional)<input id="pp" type="number" min="0" step="0.01" inputmode="decimal"></label>
        <button id="save" class="primary wide">Zur Sammlung hinzufügen</button>
        <p class="err" id="saveerr"></p>`;
      $("#save", sheet).onclick = save;
      if (s.scan) {
        const sc = s.scan.card;
        const possible = { holo: v.holo, reverse_holo: v.reverse, non_holo: v.normal };
        const known = Object.values(possible).some(x => x !== undefined);
        let finishSet = null;
        if (["holo", "reverse_holo", "non_holo"].includes(sc.finish) && (!known || possible[sc.finish])) {
          finishSet = sc.finish;
          $("#finish", sheet).value = sc.finish;
        }
        const firstSet = sc.first_edition === true && v.firstEdition !== false;
        if (firstSet) $("#first", sheet).checked = true;
        $("#scanhint", sheet).innerHTML = scanHintHtml(sc, c, v, finishSet, firstSet);
      }
      const back = $("#back", sheet);
      if (back) back.onclick = () => showResults(s.results);
    } catch (e) {
      res.innerHTML = `<p class="err">Karte konnte nicht geladen werden: ${esc(e.message)}</p>`;
    }
  }

  async function save() {
    const c = s.picked;
    const btn = $("#save", sheet);
    btn.disabled = true;
    const pp = $("#pp", sheet).value;
    const row = {
      name: c.name,
      set_name: (c.set && c.set.name) || null,
      card_number: String(c.localId),
      language: s.lang,
      condition: $("#cond", sheet).value,
      quantity: Math.max(1, parseInt($("#qty", sheet).value, 10) || 1),
      purchase_price_eur: pp === "" ? null : Number(pp),
      tcgdex_id: c.id,
      image_url: s.imageUrl,
      foil: $("#finish", sheet).value !== "non_holo",
      finish: $("#finish", sheet).value
    };
    if ($("#first", sheet).checked) row.first_edition = true;
    // Zusatzangaben für den eBay-Abgleich, nur wenn update5.sql schon gelaufen ist
    if (!state.cards.length || "set_total" in state.cards[0]) {
      row.set_total = (c.set && c.set.cardCount && c.set.cardCount.official) || null;
      row.tcg_meta = { variants: c.variants || null, setId: (c.set && c.set.id) || null };
    }
    if (needsUpdate4()) {
      $("#saveerr", sheet).textContent = UPDATE4_MSG;
      btn.disabled = false;
      return;
    }
    const { data, error } = await db.from("cards").insert(row).select().single();
    if (error) {
      $("#saveerr", sheet).textContent = /first_edition/.test(error.message)
        ? "Bitte zuerst update3.sql in Supabase ausführen, dann erneut speichern."
        : /finish|condition/.test(error.message) ? UPDATE4_MSG
        : /set_total|tcg_meta/.test(error.message) ? UPDATE5_MSG
        : "Speichern fehlgeschlagen: " + error.message;
      btn.disabled = false;
      return;
    }
    loadMain({ quiet: true });
    s.picked = null;
    const scanned = Boolean(s.scan);
    s.scan = null;
    if (scanned) s.results = [];
    showResults(s.results, `${c.name} wurde hinzugefügt. Der eBay-Wert erscheint nach der nächsten Abfrage. ${scanned ? "Du kannst direkt die nächste Karte scannen." : "Du kannst direkt die nächste Karte wählen."}`);
    const q = $("#q", sheet);
    if (q) q.select();
  }

  $("#sbtn", sheet).onclick = search;
  $("#q", sheet).addEventListener("keydown", e => { if (e.key === "Enter") search(); });
  $("#q", sheet).focus();
}

function chart(points) {

  return lineChart(points, p => Number(p.price_eur), "Verlauf des eBay-Medians");

const EXCL_LABELS = {
  graded: "bewertete Karten", multi: "Sammelangebote", variant: "andere Drucke oder Neuauflagen",
  conflict: "Angebote mit widersprüchlichen Angaben", irrelevant: "andere Karten", old: "älter als 12 Monate",

};
const MISM_LABELS = { language: "andere Sprache", edition: "andere Edition", finish: "andere Ausführung", condition: "anderer Zustand", reverse_unproven: "Reverse nicht belegt (weder im Titel noch im Merkmal)" };
const REJECT_REASONS = [
  ["language", "Andere Sprache", ""],
  ["edition", "Andere Edition", ""],
  ["finish", "Andere Ausführung", ""],
  ["reverse_unproven", "Reverse nicht belegt", "Weder Titel noch Merkmal nennen Reverse Holo. Ohne Angabe sind es meist normale Karten."],
  ["unknown_condition", "Zustand nicht erkennbar", "Weder Titel noch Merkmal nennen einen Zustand. Mit einer Detailseite lässt sich das bei einer späteren Abfrage oft noch klären."],
  ["unknown_language", "Sprache nicht erkennbar", ""],

  ["no_date", "Ohne Verkaufsdatum", ""],
];
const FIN_LABEL = { holo: "Holo", reverse_holo: "Reverse", non_holo: "Non-Holo" };
const shortDate = iso => new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" });

// Saubere Angebotslinks: nur die Artikelnummer, ohne Produktnummer (epid) und Zusatzparameter.
// Mit epid leitet eBay bei nicht mehr verfügbaren Angeboten auf die allgemeine Produktseite um.
function ebayItemUrl(itemId, url) {
  const id = String(itemId || "");
  if (/^\d{1,20}$/.test(id)) return `https://www.ebay.de/itm/${id}`;
  const m = String(url || "").match(/^https:\/\/www\.ebay\.[a-z.]+\/itm\/(?:[^/?#]*\/)?(\d{1,20})/i);
  if (m) return `https://www.ebay.de/itm/${m[1]}`;
  return /^https:\/\/www\.ebay\.[a-z.]+\//i.test(url || "") ? String(url).split(/[?#]/)[0] : "#";
}
// Vorschaubild nur von eBays Bildserver; Größe über den Dateinamen (s-l225 klein, s-l1600 groß)
function ebayImg(src, size) {
  if (typeof src !== "string" || !/^https:\/\/i\.ebayimg\.com\/[^\s"'<>]+$/.test(src)) return null;
  return /\/s-l\d+\.(jpg|jpeg|png|webp)$/i.test(src) ? src.replace(/\/s-l\d+\.(jpg|jpeg|png|webp)$/i, `/s-l${size}.$1`) : src;
}
function saleImgHtml(src) {
  const small = ebayImg(src, 225), big = ebayImg(src, 1600);
  if (!small) return "";
  return `<a class="simg" href="${esc(big)}" target="_blank" rel="noopener" title="Angebotsfoto groß öffnen"><img src="${esc(small)}" alt="Angebotsfoto" loading="lazy" onerror="this.parentNode.style.visibility='hidden'"></a>`;
}

function saleTags(s) {
  const t = [s.language || "Sprache offen", s.stage || "Zustand offen"];
  const f = s.finishEff || s.finish;
  if (f) t.push(FIN_LABEL[f] + (s.finishEff && s.finishEff !== s.finish ? " (laut Nummer)" : ""));
  if (s.edition === "1st") t.push("1st Ed.");
  return t.map(x => `<span class="tag">${esc(x)}</span>`).join("");
}

function valueBlockHtml(c, e) {
  if (!e) {
    const why = c.ebay_checked_at ? "Bisher wurde kein passender Verkauf gefunden." : "Noch nicht abgefragt. Die nächste eBay-Abfrage holt die Verkäufe.";
    return `<p class="dprice">Kein Wert</p><p class="muted dsmall">${why}</p>`;
  }
  return `<p class="dprice${e.counts ? "" : " prov"}">${eur(e.unit * c.quantity)}</p>
    <p class="muted dsmall">${c.quantity > 1 ? `${c.quantity} × ${eur(e.unit)}, ` : ""}Median ${esc(e.basis)}, ${e.n} ${e.n === 1 ? "Verkauf" : "Verkäufe"}${e.tier === "relaxed" ? ", mit Annahmen" : ""}</p>
    ${e.counts ? "" : `<p class="dnote">Vorläufig: Mit weniger als 3 Verkäufen zählt der Wert nicht in der Gesamtsumme.</p>`}`;
}

function statsHtml(c, e) {
  if (!e) return "";
  const w = (e.d && e.d.windows) || {};
  const pp = c.purchase_price_eur != null ? Number(c.purchase_price_eur) : null;
  const row = (label, value) => `<div class="drow"><dt>${label}</dt><dd>${value}</dd></div>`;
  const win = (label, x) => row(label, x && x.n ? `${eur(x.median)} <small>${x.n} ${x.n === 1 ? "Verkauf" : "Verkäufe"}</small>` : `<small>kein Verkauf</small>`);
  const out = [win("Median 30 Tage", w.d30), win("Median 90 Tage", w.d90), win("Median 12 Monate", w.d365)];
  if (e.d && e.d.last5 && e.d.last5.n) out.push(win("Letzte 5 Verkäufe", e.d.last5));
  if (pp != null) out.push(row("Kaufpreis pro Karte", eur(pp)));
  if (pp != null && e.counts) {
    const g = (e.unit - pp) * c.quantity;
    out.push(row("Gewinn/Verlust", `<span class="${trendCls(g)}">${signedEur(g)}${pp > 0 ? ` (${fmtPct((e.unit - pp) / pp * 100)})` : ""}</span>`));
  }
  return `<dl class="dstats">${out.join("")}</dl>`;
}

    <section class="dsec">

      <div class="hist" id="hist"><p class="muted">Verlauf wird geladen …</p></div>
    </section>
    <section class="dsec">
      <h3>Bearbeiten</h3>
      <div class="dform">
        <label class="fcond">Zustand<select id="cond">${condOptions(c.condition)}</select></label>
        <label class="ffin">Ausführung<select id="finish">${finishOptions(finishOf(c))}</select></label>
        <label>Menge<input id="qty" type="number" min="1" value="${c.quantity}" inputmode="numeric"></label>
        <label>Kaufpreis pro Karte in €<input id="pp" type="number" min="0" step="0.01" inputmode="decimal" value="${pp != null ? pp : ""}" placeholder="optional"></label>
        <label class="check fcheck"><input id="first" type="checkbox"${c.first_edition ? " checked" : ""}> 1st Edition</label>
        <label class="fwide">Sprache der Karte<select id="lang"><option value="DE"${c.language === "DE" ? " selected" : ""}>Deutsch</option><option value="EN"${c.language === "EN" ? " selected" : ""}>Englisch</option></select></label>
        <label class="fwide">Bildadresse (leer = automatisch)<input id="imgurl" type="url" value="${esc(c.image_url || "")}" placeholder="https://… (Adresse eines Kartenbilds)" autocomplete="off"></label>
        <label class="fwide">eBay-Suchbegriff (leer = automatisch)<input id="eq" type="text" value="${esc(c.ebay_query || "")}" placeholder="${esc(EBAY.buildQuery({ name: c.name, setName: c.set_name, setId: EBAY.setIdOf(c), finish: finishOf(c) }))}" autocomplete="off"></label>
      </div>
      <div class="dactions">
        <button id="del" class="dangerlink">Karte löschen</button>
        <button id="upd" class="primary">Änderungen speichern</button>
      </div>
      <p class="err" id="derr"></p>
    </section>`);

  let rows = null; // Verkäufe aus der Datenbank, null = nicht verfügbar

  const compute = card => {
    const live = rows.filter(r => !r.excluded).map(r => ({ ...EBAY.saleFromDb(r), _id: r.id }));
    return EBAY.matchCard(EBAY.cardFromRow(card), live);
  };

  const STAGE_NAMES = { NM: "Near Mint or Better", LP: "Lightly Played", MP: "Moderately Played", HP: "Heavily Played" };
  const openStages = new Set([c.condition]); // aufgeklappte Zustände, deiner ist zu Beginn offen
  let lastRes = null;

  const saleLi = s => `<li class="sale${ebayImg(s.image, 225) ? " hasimg" : ""}">
      ${saleImgHtml(s.image)}
      <span class="sd">${shortDate(s.soldAt)}</span>
      <span class="st">${saleTags(s)}</span>
      <span class="sp">${eur(s.price)}${s.priceUncertain ? `<small>Preisvorschlag</small>` : ""}</span>
      <a class="stl" href="${esc(ebayItemUrl(s.itemId, s.url))}" target="_blank" rel="noopener" title="${esc(s.title)}">${esc(s.title)}</a>
      <button class="ghost sx" data-x="${s._id}">Ausschließen</button>
    </li>`;

  const saleLiPlain = s => `<li class="sale${ebayImg(s.image, 225) ? " hasimg" : ""}">
      ${saleImgHtml(s.image)}
      <span class="sd">${shortDate(s.soldAt)}</span>
      <span class="st">${saleTags(s)}</span>
      <span class="sp">${eur(s.price)}${s.priceUncertain ? `<small>Preisvorschlag</small>` : ""}</span>
      <a class="stl" href="${esc(ebayItemUrl(s.itemId, s.url))}" target="_blank" rel="noopener" title="${esc(s.title)}">${esc(s.title)}</a>
    </li>`;

  const renderSales = () => {
    if (!rows) return;
    const res = compute(c);
    lastRes = res;
    const snap = EBAY.snapshotPayload(res);
    const eNow = snap ? { unit: snap.price, n: snap.details.n, basis: snap.details.basis, tier: snap.details.tier, counts: snap.details.counts, d: snap.details } : null;
    $("#dvalue", sheet).innerHTML = valueBlockHtml(c, eNow);
    $("#dstats", sheet).innerHTML = statsHtml(c, eNow);
    renderByCond(res);

    const box = $("#sales", sheet);
    if (!box) return;
    const userEx = rows.filter(r => r.excluded);
    // Aussortierte Verkäufe einzeln anzeigen, nach Grund gruppiert. Verkäufe in anderen Zuständen stehen oben in der Tabelle.
    const groups = new Map();
    for (const { sale, reason } of res.rejected) {
      if (reason === "condition") continue;
      if (!groups.has(reason)) groups.set(reason, []);
      groups.get(reason).push(sale);
    }
    const known = REJECT_REASONS.map(([k]) => k);
    const order = [...known.filter(k => groups.has(k)), ...[...groups.keys()].filter(k => !known.includes(k))];
    const total = order.reduce((n, k) => n + groups.get(k).length, 0);
    const groupHtml = order.map(k => {
      const [, label, hint] = REJECT_REASONS.find(([x]) => x === k) || [k, k, ""];
      const list = groups.get(k).sort((x, y) => new Date(y.soldAt) - new Date(x.soldAt));
      return `<details class="rgrp" data-reason="${esc(k)}"><summary>${esc(label)} (${list.length})</summary>

        <ul class="sales">${list.slice(0, 60).map(saleLiPlain).join("")}</ul>
        ${list.length > 60 ? `<p class="muted dsmall">und ${list.length - 60} weitere</p>` : ""}
      </details>`;
    }).join("");
    box.innerHTML = `
      ${total ? `<details class="more"><summary>Nicht berücksichtigt (${total} ${total === 1 ? "Verkauf" : "Verkäufe"})</summary>
        <p class="muted dsmall">Nach Grund gruppiert. Verkäufe in anderen Zuständen stehen oben in der Tabelle.</p>
        ${groupHtml}</details>` : ""}
      ${userEx.length ? `<p class="dsmall">Von dir ausgeschlossen:</p><ul class="sales">${userEx.map(r => { const im = r.parsed && r.parsed.image; return `<li class="sale${ebayImg(im, 225) ? " hasimg" : ""}">
        ${saleImgHtml(im)}
        <span class="sd">${shortDate(r.sold_at)}</span><span class="st"></span><span class="sp">${eur(Number(r.price_eur))}</span>
        <a class="stl" href="${esc(ebayItemUrl(r.item_id, r.url))}" target="_blank" rel="noopener" title="${esc(r.title)}">${esc(r.title)}</a>
        <button class="ghost sx" data-in="${r.id}">Wieder einbeziehen</button></li>`; }).join("")}</ul>` : ""}
      ${!total && !userEx.length ? `<p class="muted dsmall">Nichts aussortiert.</p>` : ""}`;
  };

  const renderByCond = res => {
    const box = $("#bycond", sheet);
    if (!box) return;
    const nowMs = Date.now();
    const head = res.tier === "none"
      ? "Für deinen Zustand gibt es keinen passenden Verkauf."
      : `Dein Wert: Median aus ${res.headline.n} ${res.headline.n === 1 ? "Verkauf" : "Verkäufen"} (${res.headline.basis})${res.tier === "strict" ? ", alle Merkmale belegt." : ", teils mit Annahmen: Eine unbekannte Sprache oder Ausführung gilt als passend."}`;
    const lines = EBAY.STAGES.map(st => {
      const r = st === c.condition ? res : compute({ ...c, condition: st });
      const h = r.headline;
      const own = st === c.condition;
      // genau die Verkäufe, aus denen der Median dieser Zeile stammt
      const days = h && h.basis === "90 Tage" ? 90 : 365;
      const list = h ? r.used.filter(x => nowMs - new Date(x.soldAt).getTime() <= days * 86400000) : [];
      const older = h ? r.used.length - list.length : 0;
      const can = list.length > 0;
      const isOpen = can && openStages.has(st);
      const price = h ? `<span class="${h.n >= 3 ? "" : "prov"}">${eur(h.value)}</span>` : `<span class="muted">–</span>`;
      const n = h ? `${h.n} ${h.n === 1 ? "Verkauf" : "Verkäufe"}, ${h.basis}${h.n >= 3 ? "" : ", vorläufig"}` : "kein Verkauf";
      const label = `<span class="chev" aria-hidden="true">${can ? (isOpen ? "▾" : "▸") : ""}</span>${st}`;
      const row = `<tr class="${[own ? "own" : "", can ? "can" : ""].join(" ").trim()}"${can ? ` data-stage="${st}"` : ""}>
        <th scope="row">${can ? `<button class="cbtn" data-stage="${st}" aria-expanded="${isOpen}">${label}</button>` : label}${own ? ` <span class="tag own-mark">deine Karte</span>` : ""}<small>${STAGE_NAMES[st]}</small></th>
        <td class="num price">${price}</td>
        <td class="num"><small>${n}</small></td></tr>`;
      const exp = isOpen ? `<tr class="exp" data-for="${st}"><td colspan="3">
        <ul class="sales">${list.slice(0, 40).map(saleLi).join("")}</ul>
        ${list.length > 40 ? `<p class="muted dsmall">und ${list.length - 40} weitere</p>` : ""}
        ${older ? `<p class="muted dsmall">Dazu ${older} ${older === 1 ? "älterer Verkauf" : "ältere Verkäufe"} bis 12 Monate, nicht im Median.</p>` : ""}
      </td></tr>` : "";
      return row + exp;
    }).join("");
    const unknown = res.rejected.filter(x => x.reason === "unknown_condition").length;
    // Beginn des geladenen Zeitraums: einzelne sehr alte Verkäufe (Angebote mit mehreren Stück) zählen nicht
    const times = rows.map(r => new Date(r.sold_at).getTime()).filter(Number.isFinite).sort((x, y) => x - y);
    const oldest = times.length ? times[Math.floor(times.length * 0.05)] : null;
    const span = oldest == null ? null : Math.floor((nowMs - oldest) / 86400000);
    const since = oldest == null ? "" : shortDate(new Date(oldest).toISOString());
    const cover = oldest == null ? "" : rows.length >= 50 && span < 90
      ? `Die geladenen Verkäufe reichen nur bis ${since} zurück, ältere sind nicht geladen. „90 Tage“ umfasst hier also nur ${span} Tage.`
      : `Geladene Verkäufe seit ${since}.`;
    box.innerHTML = `
      <p class="dsmall">${esc(head)}</p>
      <table class="ctab">
        <thead><tr><th scope="col">Zustand</th><th scope="col" class="num">Median</th><th scope="col" class="num">Grundlage</th></tr></thead>
        <tbody>${lines}</tbody>
      </table>
      <p class="muted dsmall">Tippe auf einen Zustand, um die einzelnen Verkäufe mit Link zu eBay zu sehen. Gleiche Sprache, Edition und Ausführung wie deine Karte, nur der Zustand wechselt. Grau: weniger als 3 Verkäufe.</p>
      ${unknown ? `<p class="muted dsmall">${unknown} passende ${unknown === 1 ? "Verkauf lässt" : "Verkäufe lassen"} sich keinem Zustand zuordnen und ${unknown === 1 ? "fehlt" : "fehlen"} in der Tabelle.</p>` : ""}
      ${cover ? `<p class="muted dsmall">${esc(cover)}</p>` : ""}`;
  };

  const saveValue = async card => {
    const hadValue = Boolean((state.latest[card.id] || {}).ebay_sold);
    await writeSnapshot(card, compute(card), hadValue);
    await loadMain({ quiet: true });
  };

  const toggleSale = async (rowId, excluded) => {
    const msg = $("#smsg", sheet);
    if (msg) msg.textContent = "";
    const { error } = await db.from("ebay_sales").update({ excluded }).eq("id", rowId);
    if (error) { if (msg) msg.textContent = "Ausschließen fehlgeschlagen: " + error.message; renderSales(); return; }
    rows.find(r => r.id === rowId).excluded = excluded;
    renderSales();
    await saveValue(c);
  };

  const onSaleButton = ev => {
    const b = ev.target.closest("[data-x],[data-in]");
    if (!b) return false;
    b.disabled = true;
    toggleSale(Number(b.dataset.x ?? b.dataset.in), b.dataset.x !== undefined);
    return true;
  };
  // Nicht direkt onSaleButton zuweisen: dessen Rückgabe "false" würde jeden anderen Klick (Dropdown, Links) blockieren
  $("#sales", sheet).onclick = ev => { onSaleButton(ev); };
  $("#bycond", sheet).onclick = ev => {
    if (onSaleButton(ev) || ev.target.closest("a")) return;
    const t = ev.target.closest("[data-stage]");
    if (!t || !lastRes) return;
    const st = t.dataset.stage;
    if (openStages.has(st)) openStages.delete(st); else openStages.add(st);
    renderByCond(lastRes);
    // Fokus nur nach Tastaturbedienung zurücksetzen (ev.detail ist dann 0), sonst bleibt nach einem Tipp ein Rahmen stehen
    const btn = $(`#bycond .cbtn[data-stage="${st}"]`, sheet);
    if (btn && ev.detail === 0) btn.focus({ preventScroll: true });
  };

  const loaded = await db.from("ebay_sales")
    .select("id,item_id,sold_at,price_eur,title,url,parsed,excluded")
    .eq("card_id", id).order("sold_at", { ascending: false }).limit(1000);
  if (loaded.error) {
    const box = $("#sales", sheet);
    if (box) box.innerHTML = `<p class="muted dsmall">${/ebay_sales|relation|does not exist|schema cache/i.test(loaded.error.message) ? esc(UPDATE5_MSG) : "Die Verkäufe konnten nicht geladen werden: " + esc(loaded.error.message)}</p>`;
    const bc = $("#bycond", sheet);
    if (bc) bc.innerHTML = `<p class="muted dsmall">Ohne geladene Verkäufe gibt es keine Preise nach Zustand.</p>`;
  } else {
    rows = loaded.data || [];
    renderSales();
  }

  $("#upd", sheet).onclick = async () => {
    const ppv = $("#pp", sheet).value;
    const patch = {
      condition: $("#cond", sheet).value,
      quantity: Math.max(1, parseInt($("#qty", sheet).value, 10) || 1),
      purchase_price_eur: ppv === "" ? null : Number(ppv)
    };
    // Spalten nur senden, wenn sich der Wert ändert: so funktioniert Speichern auch vor den SQL-Updates
    const fe = $("#first", sheet).checked;
    if (fe !== Boolean(c.first_edition)) patch.first_edition = fe;
    const fin = $("#finish", sheet).value;
    if (fin !== finishOf(c)) { patch.finish = fin; patch.foil = fin !== "non_holo"; }
    const lang = $("#lang", sheet).value;
    if (lang !== c.language) patch.language = lang;
    const iu = $("#imgurl", sheet).value.trim();
    if (iu && !/^https:\/\//i.test(iu)) { $("#derr", sheet).textContent = "Die Bildadresse muss mit https:// beginnen."; return; }
    if ((iu || null) !== (c.image_url || null)) patch.image_url = iu || null;
    const q = $("#eq", sheet).value.trim();
    if ((q || null) !== (c.ebay_query || null)) { patch.ebay_query = q || null; patch.ebay_checked_at = null; } // neuer Suchbegriff: beim nächsten Lauf sofort abfragen
    if (needsUpdate4()) { $("#derr", sheet).textContent = UPDATE4_MSG; return; }
    const { error } = await db.from("cards").update(patch).eq("id", id);
    if (error) {
      $("#derr", sheet).textContent = /first_edition/.test(error.message)
        ? "Bitte zuerst update3.sql in Supabase ausführen, dann erneut speichern."
        : /finish|condition/.test(error.message) ? UPDATE4_MSG
        : /ebay_query/.test(error.message) ? UPDATE5_MSG
        : "Speichern fehlgeschlagen: " + error.message;
      return;
    }
    if (rows) await writeSnapshot({ ...c, ...patch }, compute({ ...c, ...patch }), Boolean((state.latest[id] || {}).ebay_sold));
    closeSheet();
    await loadMain({ quiet: true });
  };

  $("#del", sheet).onclick = async () => {
    if (!confirm("Karte wirklich löschen? Verkäufe und Preisverlauf werden mit gelöscht.")) return;
    const { error } = await db.from("cards").delete().eq("id", id);
    if (error) { $("#derr", sheet).textContent = "Löschen fehlgeschlagen: " + error.message; return; }
    closeSheet();
    await loadMain({ quiet: true });
  };

  const hq = await db.from("price_snapshots")
    .select("captured_on,price_eur,details")
    .eq("card_id", id).eq("source", "ebay_sold")
    .order("captured_on", { ascending: true }).limit(365);
  const hist = $("#hist", sheet);
  if (hist) hist.innerHTML = hq.error ? `<p class="err">Verlauf konnte nicht geladen werden.</p>` : chart((hq.data || []).filter(p => !(p.details && p.details.none)));
}

/* ---------- Start ---------- */

document.addEventListener("click", e => { if (!e.target.closest(".menuwrap")) closeMenu(false); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (closeMenu(true)) return;
  if ($("#sheet")) closeSheet();
});

let uid = null;
db.auth.onAuthStateChange((event, session) => {
  const id = session && session.user ? session.user.id : null;
  if (id === uid && event !== "INITIAL_SESSION") return;
  uid = id;
  setTimeout(() => { id ? loadMain() : renderLogin(); }, 0);
});
})();
</script>
</body>
</html>
